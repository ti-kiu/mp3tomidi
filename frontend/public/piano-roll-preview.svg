<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300">
  <rect width="500" height="300" rx="16" fill="#FDF8F3"/>
  <!-- Piano roll visualization -->
  <rect x="40" y="30" width="420" height="240" rx="12" fill="#fff" stroke="#E7E5E4" stroke-width="1"/>
  <!-- Grid lines -->
  <line x1="40" y1="90" x2="460" y2="90" stroke="#F5F5F4" stroke-width="1"/>
  <line x1="40" y1="150" x2="460" y2="150" stroke="#F5F5F4" stroke-width="1"/>
  <line x1="40" y1="210" x2="460" y2="210" stroke="#F5F5F4" stroke-width="1"/>
  <line x1="140" y1="30" x2="140" y2="270" stroke="#F5F5F4" stroke-width="1"/>
  <line x1="240" y1="30" x2="240" y2="270" stroke="#F5F5F4" stroke-width="1"/>
  <line x1="340" y1="30" x2="340" y2="270" stroke="#F5F5F4" stroke-width="1"/>
  <!-- MIDI notes on piano roll -->
  <rect x="60" y="80" width="80" height="20" rx="4" fill="#EA580C" opacity="0.8"/>
  <rect x="160" y="120" width="60" height="20" rx="4" fill="#FB923C" opacity="0.7"/>
  <rect x="240" y="60" width="100" height="20" rx="4" fill="#EA580C" opacity="0.9"/>
  <rect x="360" y="140" width="70" height="20" rx="4" fill="#C8B8A8" opacity="0.8"/>
  <rect x="100" y="180" width="90" height="20" rx="4" fill="#EA580C" opacity="0.6"/>
  <rect x="280" y="200" width="80" height="20" rx="4" fill="#FB923C" opacity="0.7"/>
  <rect x="180" y="160" width="50" height="20" rx="4" fill="#C8B8A8" opacity="0.9"/>
  <rect x="350" y="100" width="60" height="20" rx="4" fill="#EA580C" opacity="0.7"/>
  <!-- Label -->
  <text x="250" y="290" font-family="DM Sans, sans-serif" font-size="13" fill="#78716C" text-anchor="middle">MIDI Piano Roll Preview</text>
</svg>
