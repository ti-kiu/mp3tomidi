<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDF8F3"/>
      <stop offset="100%" style="stop-color:#FFF7ED"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EA580C"/>
      <stop offset="100%" style="stop-color:#F97316"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="24" fill="url(#bg)"/>
  <!-- Waveform bars -->
  <rect x="40" y="120" width="20" height="80" rx="10" fill="url(#bar)" opacity="0.6"/>
  <rect x="70" y="80" width="20" height="160" rx="10" fill="url(#bar)" opacity="0.8"/>
  <rect x="100" y="100" width="20" height="120" rx="10" fill="url(#bar)"/>
  <rect x="130" y="60" width="20" height="200" rx="10" fill="url(#bar)" opacity="0.9"/>
  <rect x="160" y="110" width="20" height="100" rx="10" fill="url(#bar)" opacity="0.7"/>
  <rect x="190" y="90" width="20" height="140" rx="10" fill="url(#bar)"/>
  <!-- Arrow -->
  <text x="230" y="170" font-family="Arial" font-size="32" fill="#C8B8A8" text-anchor="middle">→</text>
  <!-- MIDI notes -->
  <circle cx="280" cy="140" r="12" fill="#EA580C"/>
  <rect x="292" y="90" width="5" height="50" rx="2.5" fill="#EA580C"/>
  <circle cx="320" cy="160" r="12" fill="#C8B8A8"/>
  <rect x="332" y="110" width="5" height="50" rx="2.5" fill="#C8B8A8"/>
  <circle cx="350" cy="130" r="12" fill="#EA580C" opacity="0.8"/>
  <rect x="362" y="80" width="5" height="50" rx="2.5" fill="#EA580C" opacity="0.8"/>
</svg>
