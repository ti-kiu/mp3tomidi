<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300">
  <rect width="500" height="300" rx="16" fill="#FEF3C7"/>
  <!-- DAW window -->
  <rect x="30" y="30" width="440" height="240" rx="12" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1"/>
  <!-- Window header -->
  <rect x="30" y="30" width="440" height="36" rx="12" fill="#FCD34D"/>
  <circle cx="56" cy="48" r="6" fill="#F59E0B"/>
  <circle cx="76" cy="48" r="6" fill="#FBBF24"/>
  <circle cx="96" cy="48" r="6" fill="#FDE68A"/>
  <text x="250" y="53" font-family="DM Sans, sans-serif" font-size="12" font-weight="600" fill="#92400E" text-anchor="middle">DAW - Project.mid</text>
  <!-- Piano roll area -->
  <rect x="50" y="80" width="200" height="170" rx="8" fill="#fff" stroke="#E7E5E4" stroke-width="1"/>
  <!-- Piano keys on left -->
  <rect x="50" y="80" width="30" height="170" rx="4" fill="#F5F5F4"/>
  <rect x="52" y="100" width="26" height="12" rx="2" fill="#fff"/>
  <rect x="52" y="120" width="26" height="12" rx="2" fill="#fff"/>
  <rect x="52" y="140" width="26" height="12" rx="2" fill="#333"/>
  <rect x="52" y="160" width="26" height="12" rx="2" fill="#fff"/>
  <rect x="52" y="180" width="26" height="12" rx="2" fill="#333"/>
  <rect x="52" y="200" width="26" height="12" rx="2" fill="#fff"/>
  <rect x="52" y="220" width="26" height="12" rx="2" fill="#fff"/>
  <!-- Notes in piano roll -->
  <rect x="90" y="100" width="40" height="10" rx="3" fill="#EA580C"/>
  <rect x="140" y="120" width="30" height="10" rx="3" fill="#FB923C"/>
  <rect x="180" y="100" width="50" height="10" rx="3" fill="#EA580C" opacity="0.8"/>
  <rect x="90" y="160" width="60" height="10" rx="3" fill="#C8B8A8"/>
  <rect x="160" y="180" width="40" height="10" rx="3" fill="#EA580C" opacity="0.6"/>
  <!-- File info panel on right -->
  <rect x="280" y="80" width="170" height="80" rx="8" fill="#FEF3C7"/>
  <text x="295" y="105" font-family="JetBrains Mono, monospace" font-size="11" fill="#92400E">File: converted.mid</text>
  <text x="295" y="125" font-family="JetBrains Mono, monospace" font-size="11" fill="#78716C">Notes: 847</text>
  <text x="295" y="145" font-family="JetBrains Mono, monospace" font-size="11" fill="#78716C">Duration: 3:24</text>
  <!-- Transport bar -->
  <rect x="280" y="180" width="170" height="40" rx="8" fill="#FCD34D"/>
  <text x="320" y="205" font-family="DM Sans, sans-serif" font-size="18" fill="#92400E">▶</text>
  <text x="365" y="205" font-family="JetBrains Mono, monospace" font-size="11" fill="#92400E">0:00 / 3:24</text>
</svg>
