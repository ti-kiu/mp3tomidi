<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDF8F3"/>
      <stop offset="100%" style="stop-color:#FFF7ED"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EA580C"/>
      <stop offset="100%" style="stop-color:#FB923C"/>
    </linearGradient>
  </defs>
  <rect width="500" height="400" rx="20" fill="url(#bg)"/>
  <!-- Waveform -->
  <rect x="40" y="160" width="18" height="100" rx="9" fill="url(#wave)" opacity="0.6"/>
  <rect x="68" y="120" width="18" height="180" rx="9" fill="url(#wave)" opacity="0.8"/>
  <rect x="96" y="140" width="18" height="140" rx="9" fill="url(#wave)"/>
  <rect x="124" y="100" width="18" height="220" rx="9" fill="url(#wave)" opacity="0.9"/>
  <rect x="152" y="150" width="18" height="120" rx="9" fill="url(#wave)" opacity="0.7"/>
  <rect x="180" y="110" width="18" height="200" rx="9" fill="url(#wave)"/>
  <rect x="208" y="130" width="18" height="160" rx="9" fill="url(#wave)" opacity="0.8"/>
  <!-- Arrow -->
  <path d="M250 210 L290 210" stroke="#C8B8A8" stroke-width="3" stroke-linecap="round"/>
  <path d="M280 200 L295 210 L280 220" fill="none" stroke="#C8B8A8" stroke-width="3" stroke-linecap="round"/>
  <!-- MIDI notes -->
  <circle cx="330" cy="180" r="14" fill="#EA580C"/>
  <rect x="344" y="120" width="5" height="60" rx="2.5" fill="#EA580C"/>
  <circle cx="370" cy="200" r="14" fill="#C8B8A8"/>
  <rect x="384" y="140" width="5" height="60" rx="2.5" fill="#C8B8A8"/>
  <circle cx="410" cy="170" r="14" fill="#EA580C" opacity="0.8"/>
  <rect x="424" y="110" width="5" height="60" rx="2.5" fill="#EA580C" opacity="0.8"/>
  <circle cx="450" cy="190" r="14" fill="#C8B8A8" opacity="0.6"/>
  <rect x="464" y="130" width="5" height="60" rx="2.5" fill="#C8B8A8" opacity="0.6"/>
  <!-- Labels -->
  <text x="124" y="350" font-family="DM Sans, sans-serif" font-size="13" fill="#78716C" text-anchor="middle">Audio Waveform</text>
  <text x="390" y="350" font-family="DM Sans, sans-serif" font-size="13" fill="#78716C" text-anchor="middle">MIDI Notes</text>
</svg>
