<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E6FAF7"/>
      <stop offset="100%" style="stop-color:#CCFBF1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="24" fill="url(#bg)"/>
  <!-- Speed gauge -->
  <circle cx="200" cy="130" r="80" fill="none" stroke="#E0F5F1" stroke-width="12"/>
  <circle cx="200" cy="130" r="80" fill="none" stroke="#0D9488" stroke-width="12" stroke-dasharray="350" stroke-dashoffset="50" stroke-linecap="round"/>
  <!-- Speed number -->
  <text x="200" y="125" font-family="Space Grotesk, Arial" font-size="48" font-weight="700" fill="#0D9488" text-anchor="middle">&lt;15s</text>
  <text x="200" y="155" font-family="DM Sans, Arial" font-size="14" fill="#78716C" text-anchor="middle">per minute of audio</text>
  <!-- Progress bar -->
  <rect x="60" y="240" width="280" height="12" rx="6" fill="#E0F5F1"/>
  <rect x="60" y="240" width="238" height="12" rx="6" fill="#0D9488"/>
  <text x="200" y="275" font-family="DM Sans, Arial" font-size="12" fill="#78716C" text-anchor="middle">WebGL-accelerated processing</text>
</svg>
