<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDF8F3"/>
      <stop offset="100%" style="stop-color:#F5EDE4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Browser window -->
  <rect x="40" y="30" width="720" height="340" rx="12" fill="#fff" stroke="#E5DDD4" stroke-width="2"/>
  <!-- Title bar -->
  <rect x="40" y="30" width="720" height="44" rx="12" fill="#F5EDE4"/>
  <rect x="40" y="62" width="720" height="12" fill="#F5EDE4"/>
  <circle cx="64" cy="52" r="6" fill="#E8604C"/>
  <circle cx="84" cy="52" r="6" fill="#F0C040"/>
  <circle cx="104" cy="52" r="6" fill="#62C554"/>
  <rect x="130" y="42" width="400" height="22" rx="11" fill="#fff" stroke="#D4C8BC"/>
  <text x="330" y="57" text-anchor="middle" font-family="system-ui" font-size="11" fill="#8B7355">mp3tomidi.vip</text>
  <!-- Header -->
  <text x="400" y="105" text-anchor="middle" font-family="system-ui" font-size="22" fill="#2D2319" font-weight="700">MP3 to MIDI Converter</text>
  <!-- Upload area -->
  <rect x="160" y="120" width="480" height="100" rx="16" fill="#FDF8F3" stroke="#EA580C" stroke-width="2" stroke-dasharray="8,6"/>
  <!-- Music note icon -->
  <g transform="translate(400,155)">
    <text x="0" y="0" text-anchor="middle" font-size="32" fill="#EA580C">♫</text>
  </g>
  <text x="400" y="192" text-anchor="middle" font-family="system-ui" font-size="14" fill="#8B7355">Drag & drop MP3, WAV, or FLAC</text>
  <!-- Format pills -->
  <g transform="translate(400,245)">
    <rect x="-180" y="0" width="80" height="28" rx="14" fill="#EA580C" opacity="0.1"/>
    <text x="-140" y="19" text-anchor="middle" font-family="system-ui" font-size="12" fill="#EA580C" font-weight="600">.mp3</text>
    <rect x="-80" y="0" width="80" height="28" rx="14" fill="#EA580C" opacity="0.1"/>
    <text x="-40" y="19" text-anchor="middle" font-family="system-ui" font-size="12" fill="#EA580C" font-weight="600">.wav</text>
    <rect x="20" y="0" width="80" height="28" rx="14" fill="#EA580C" opacity="0.1"/>
    <text x="60" y="19" text-anchor="middle" font-family="system-ui" font-size="12" fill="#EA580C" font-weight="600">.flac</text>
    <rect x="100" y="0" width="80" height="28" rx="14" fill="#EA580C" opacity="0.1"/>
    <text x="140" y="19" text-anchor="middle" font-family="system-ui" font-size="12" fill="#EA580C" font-weight="600">.ogg</text>
  </g>
  <!-- Features -->
  <g transform="translate(180,300)">
    <circle cx="0" cy="0" r="8" fill="#EA580C"/>
    <text x="16" y="5" font-family="system-ui" font-size="13" fill="#2D2319">Multi-track separation</text>
  </g>
  <g transform="translate(420,300)">
    <circle cx="0" cy="0" r="8" fill="#EA580C"/>
    <text x="16" y="5" font-family="system-ui" font-size="13" fill="#2D2319">100% browser-based</text>
  </g>
  <g transform="translate(180,330)">
    <circle cx="0" cy="0" r="8" fill="#EA580C"/>
    <text x="16" y="5" font-family="system-ui" font-size="13" fill="#2D2319">Piano roll preview</text>
  </g>
  <g transform="translate(420,330)">
    <circle cx="0" cy="0" r="8" fill="#EA580C"/>
    <text x="16" y="5" font-family="system-ui" font-size="13" fill="#2D2319">Free, no sign-up</text>
  </g>
  <!-- Convert button -->
  <rect x="300" y="355" width="200" height="36" rx="18" fill="#EA580C"/>
  <text x="400" y="378" text-anchor="middle" font-family="system-ui" font-size="15" fill="#fff" font-weight="600">Convert Now — Free</text>
</svg>