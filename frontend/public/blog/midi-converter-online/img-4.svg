<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDF8F3"/>
  <text x="400" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#1a1a1a">Privacy: Where Does Your Audio Go?</text>
  <!-- Arrow diagram -->
  <rect x="40" y="100" width="200" height="100" rx="12" fill="white" stroke="#22c55e" stroke-width="2"/>
  <text x="140" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#22c55e">Your Device</text>
  <text x="140" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b7280">Audio + Processing</text>
  <path d="M260 150 L340 150" stroke="#22c55e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="300" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#22c55e">stays here</text>
  <rect x="360" y="100" width="200" height="100" rx="12" fill="white" stroke="#22c55e" stroke-width="2"/>
  <text x="460" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#22c55e">Your Device</text>
  <text x="460" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b7280">MIDI output</text>
  <text x="300" y="260" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#EA580C">✓ No server upload</text>
  <text x="300" y="290" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#EA580C">✓ No data stored</text>
  <text x="300" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#EA580C">✓ Works offline</text>
  <text x="400" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#C8B8A8">MP3toMIDI processes everything in your browser</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
    </marker>
  </defs>
</svg>