<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDF8F3"/>
  <text x="400" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#1a1a1a">Conversion Speed Benchmarks</text>
  <!-- Speed bars -->
  <text x="50" y="100" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">MP3toMIDI</text>
  <rect x="180" y="82" width="500" height="28" rx="4" fill="#EA580C"/>
  <text x="690" y="102" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#EA580C">3.2s</text>
  <text x="50" y="160" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">Basic Pitch</text>
  <rect x="180" y="142" width="375" height="28" rx="4" fill="#C8B8A8"/>
  <text x="565" y="162" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">5.8s</text>
  <text x="50" y="220" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">AmazingMIDI</text>
  <rect x="180" y="202" width="450" height="28" rx="4" fill="#C8B8A8"/>
  <text x="640" y="222" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">8.1s</text>
  <text x="50" y="280" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">MIDIculous</text>
  <rect x="180" y="262" width="420" height="28" rx="4" fill="#C8B8A8"/>
  <text x="610" y="282" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">12.4s</text>
  <text x="50" y="340" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">WIDI Recognition</text>
  <rect x="180" y="322" width="350" height="28" rx="4" fill="#C8B8A8"/>
  <text x="540" y="342" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">15.7s</text>
  <text x="400" y="390" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#9ca3af">Average time for a 3-minute audio file (lower is better)</text>
</svg>