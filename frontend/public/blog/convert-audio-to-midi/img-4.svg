<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" rx="16" fill="#FDF8F3"/>
  <text x="400" y="40" font-family="Space Grotesk, Arial" font-size="22" font-weight="700" fill="#1C1917" text-anchor="middle">100% Browser-Side Processing</text>
  <!-- Browser window -->
  <rect x="60" y="60" width="680" height="300" rx="16" fill="#fff" stroke="#E7E5E4" stroke-width="1.5"/>
  <!-- Browser header -->
  <rect x="60" y="60" width="680" height="40" rx="16" fill="#F5F5F4"/>
  <rect x="60" y="85" width="680" height="15" fill="#F5F5F4"/>
  <circle cx="86" cy="80" r="7" fill="#EF4444"/>
  <circle cx="108" cy="80" r="7" fill="#F59E0B"/>
  <circle cx="130" cy="80" r="7" fill="#22C55E"/>
  <!-- Lock icon in URL bar -->
  <rect x="180" y="70" width="400" height="24" rx="6" fill="#fff"/>
  <text x="195" y="86" font-family="DM Sans, Arial" font-size="11" fill="#22C55E">🔒</text>
  <text x="215" y="86" font-family="JetBrains Mono, Arial" font-size="11" fill="#78716C">mp3tomidi.vip</text>
  <!-- Content area -->
  <text x="400" y="140" font-family="DM Sans, Arial" font-size="18" font-weight="600" fill="#1C1917" text-anchor="middle">Your audio never leaves your device</text>
  <!-- WebAssembly icon -->
  <rect x="150" y="170" width="200" height="100" rx="12" fill="#FDF8F3" stroke="#EA580C" stroke-width="2"/>
  <text x="250" y="210" font-family="DM Sans, Arial" font-size="16" font-weight="600" fill="#EA580C" text-anchor="middle">WebAssembly</text>
  <text x="250" y="235" font-family="DM Sans, Arial" font-size="12" fill="#78716C" text-anchor="middle">Runs in your browser</text>
  <text x="250" y="255" font-family="DM Sans, Arial" font-size="12" fill="#78716C" text-anchor="middle">No server upload</text>
  <!-- Lock shield -->
  <rect x="450" y="170" width="200" height="100" rx="12" fill="#FDF8F3" stroke="#0D9488" stroke-width="2"/>
  <text x="550" y="210" font-family="DM Sans, Arial" font-size="16" font-weight="600" fill="#0D9488" text-anchor="middle">100% Private</text>
  <text x="550" y="235" font-family="DM Sans, Arial" font-size="12" fill="#78716C" text-anchor="middle">No data collection</text>
  <text x="550" y="255" font-family="DM Sans, Arial" font-size="12" fill="#78716C" text-anchor="middle">GDPR compliant</text>
  <!-- Bottom badge -->
  <rect x="250" y="310" width="300" height="30" rx="15" fill="#EA580C"/>
  <text x="400" y="330" font-family="DM Sans, Arial" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">✓ No audio uploaded · ✓ No account needed</text>
</svg>
