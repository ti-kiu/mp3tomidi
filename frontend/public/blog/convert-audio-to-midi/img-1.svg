<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" rx="16" fill="#FDF8F3"/>
  <text x="400" y="45" font-family="Space Grotesk, Arial" font-size="22" font-weight="700" fill="#1C1917" text-anchor="middle">Supported Audio Formats</text>
  <!-- Format cards in grid -->
  <rect x="40" y="70" width="160" height="70" rx="12" fill="#fff" stroke="#EA580C" stroke-width="2"/>
  <text x="120" y="100" font-family="JetBrains Mono, Arial" font-size="18" font-weight="700" fill="#EA580C" text-anchor="middle">.MP3</text>
  <text x="120" y="125" font-family="DM Sans, Arial" font-size="11" fill="#78716C" text-anchor="middle">Lossy · Small size</text>
  <rect x="220" y="70" width="160" height="70" rx="12" fill="#fff" stroke="#0D9488" stroke-width="2"/>
  <text x="300" y="100" font-family="JetBrains Mono, Arial" font-size="18" font-weight="700" fill="#0D9488" text-anchor="middle">.WAV</text>
  <text x="300" y="125" font-family="DM Sans, Arial" font-size="11" fill="#78716C" text-anchor="middle">Lossless · Best quality</text>
  <rect x="400" y="70" width="160" height="70" rx="12" fill="#fff" stroke="#D97706" stroke-width="2"/>
  <text x="480" y="100" font-family="JetBrains Mono, Arial" font-size="18" font-weight="700" fill="#D97706" text-anchor="middle">.FLAC</text>
  <text x="480" y="125" font-family="DM Sans, Arial" font-size="11" fill="#78716C" text-anchor="middle">Lossless · Compressed</text>
  <rect x="580" y="70" width="180" height="70" rx="12" fill="#fff" stroke="#C8B8A8" stroke-width="2"/>
  <text x="670" y="100" font-family="JetBrains Mono, Arial" font-size="18" font-weight="700" fill="#78716C" text-anchor="middle">.OGG</text>
  <text x="670" y="125" font-family="DM Sans, Arial" font-size="11" fill="#78716C" text-anchor="middle">Open source format</text>
  <rect x="40" y="160" width="160" height="70" rx="12" fill="#fff" stroke="#C8B8A8" stroke-width="2"/>
  <text x="120" y="190" font-family="JetBrains Mono, Arial" font-size="18" font-weight="700" fill="#78716C" text-anchor="middle">.M4A</text>
  <text x="120" y="215" font-family="DM Sans, Arial" font-size="11" fill="#78716C" text-anchor="middle">Apple format</text>
  <rect x="220" y="160" width="160" height="70" rx="12" fill="#fff" stroke="#C8B8A8" stroke-width="2"/>
  <text x="300" y="190" font-family="JetBrains Mono, Arial" font-size="18" font-weight="700" fill="#78716C" text-anchor="middle">.AAC</text>
  <text x="300" y="215" font-family="DM Sans, Arial" font-size="11" fill="#78716C" text-anchor="middle">Advanced coding</text>
  <rect x="400" y="160" width="160" height="70" rx="12" fill="#fff" stroke="#C8B8A8" stroke-width="2"/>
  <text x="480" y="190" font-family="JetBrains Mono, Arial" font-size="18" font-weight="700" fill="#78716C" text-anchor="middle">.AIFF</text>
  <text x="480" y="215" font-family="DM Sans, Arial" font-size="11" fill="#78716C" text-anchor="middle">Apple lossless</text>
  <rect x="580" y="160" width="180" height="70" rx="12" fill="#fff" stroke="#C8B8A8" stroke-width="2"/>
  <text x="670" y="190" font-family="JetBrains Mono, Arial" font-size="18" font-weight="700" fill="#78716C" text-anchor="middle">.WMA</text>
  <text x="670" y="215" font-family="DM Sans, Arial" font-size="11" fill="#78716C" text-anchor="middle">Windows media</text>
  <!-- Arrow to .mid -->
  <rect x="280" y="270" width="240" height="60" rx="12" fill="#EA580C"/>
  <text x="400" y="307" font-family="JetBrains Mono, Arial" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">→ .MIDI</text>
  <text x="400" y="370" font-family="DM Sans, Arial" font-size="13" fill="#78716C" text-anchor="middle">All formats convert to standard MIDI</text>
</svg>
