<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" rx="16" fill="#FDF8F3"/>
  <text x="400" y="40" font-family="Space Grotesk, Arial" font-size="22" font-weight="700" fill="#1C1917" text-anchor="middle">Accuracy by Instrument Type</text>
  <!-- Bar chart -->
  <rect x="100" y="80" width="600" height="260" rx="12" fill="#fff" stroke="#E7E5E4" stroke-width="1"/>
  <!-- Y-axis labels -->
  <text x="85" y="100" font-family="DM Sans, Arial" font-size="12" fill="#78716C" text-anchor="end">100%</text>
  <text x="85" y="165" font-family="DM Sans, Arial" font-size="12" fill="#78716C" text-anchor="end">75%</text>
  <text x="85" y="230" font-family="DM Sans, Arial" font-size="12" fill="#78716C" text-anchor="end">50%</text>
  <text x="85" y="295" font-family="DM Sans, Arial" font-size="12" fill="#78716C" text-anchor="end">25%</text>
  <!-- Grid lines -->
  <line x1="100" y1="95" x2="700" y2="95" stroke="#F5F5F4" stroke-width="1"/>
  <line x1="100" y1="160" x2="700" y2="160" stroke="#F5F5F4" stroke-width="1"/>
  <line x1="100" y1="225" x2="700" y2="225" stroke="#F5F5F4" stroke-width="1"/>
  <line x1="100" y1="290" x2="700" y2="290" stroke="#F5F5F4" stroke-width="1"/>
  <!-- Piano bar -->
  <rect x="150" y="105" width="80" height="225" rx="6" fill="#EA580C"/>
  <text x="190" y="130" font-family="DM Sans, Arial" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">97.8%</text>
  <text x="190" y="350" font-family="DM Sans, Arial" font-size="13" fill="#1C1917" text-anchor="middle">Piano</text>
  <!-- Vocals bar -->
  <rect x="280" y="130" width="80" height="200" rx="6" fill="#0D9488"/>
  <text x="320" y="155" font-family="DM Sans, Arial" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">94.2%</text>
  <text x="320" y="350" font-family="DM Sans, Arial" font-size="13" fill="#1C1917" text-anchor="middle">Vocals</text>
  <!-- Guitar bar -->
  <rect x="410" y="155" width="80" height="175" rx="6" fill="#D97706"/>
  <text x="450" y="180" font-family="DM Sans, Arial" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">91.5%</text>
  <text x="450" y="350" font-family="DM Sans, Arial" font-size="13" fill="#1C1917" text-anchor="middle">Guitar</text>
  <!-- Full Mix bar -->
  <rect x="540" y="210" width="80" height="120" rx="6" fill="#C8B8A8"/>
  <text x="580" y="235" font-family="DM Sans, Arial" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">78.3%</text>
  <text x="580" y="350" font-family="DM Sans, Arial" font-size="13" fill="#1C1917" text-anchor="middle">Full Mix</text>
  <text x="400" y="390" font-family="DM Sans, Arial" font-size="12" fill="#78716C" text-anchor="middle">Solo instruments have the highest MIDI conversion accuracy</text>
</svg>
