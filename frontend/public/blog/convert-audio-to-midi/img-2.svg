<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" rx="16" fill="#FDF8F3"/>
  <text x="400" y="40" font-family="Space Grotesk, Arial" font-size="22" font-weight="700" fill="#1C1917" text-anchor="middle">3-Step Conversion Process</text>
  <!-- Step 1: Upload -->
  <rect x="30" y="70" width="220" height="200" rx="16" fill="#fff" stroke="#E7E5E4" stroke-width="1"/>
  <circle cx="140" cy="110" r="28" fill="#EA580C"/>
  <text x="140" y="118" font-family="DM Sans, Arial" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="140" y="165" font-family="DM Sans, Arial" font-size="16" font-weight="600" fill="#1C1917" text-anchor="middle">Upload Audio</text>
  <rect x="70" y="185" width="140" height="50" rx="8" fill="#F5F5F4" stroke="#E7E5E4" stroke-width="1" stroke-dasharray="4"/>
  <text x="140" y="215" font-family="DM Sans, Arial" font-size="12" fill="#78716C" text-anchor="middle">Drop file here</text>
  <!-- Arrow -->
  <path d="M260 170 L290 170" stroke="#C8B8A8" stroke-width="3"/>
  <path d="M285 165 L292 170 L285 175" fill="none" stroke="#C8B8A8" stroke-width="3"/>
  <!-- Step 2: AI Process -->
  <rect x="300" y="70" width="220" height="200" rx="16" fill="#fff" stroke="#E7E5E4" stroke-width="1"/>
  <circle cx="410" cy="110" r="28" fill="#0D9488"/>
  <text x="410" y="118" font-family="DM Sans, Arial" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="410" y="165" font-family="DM Sans, Arial" font-size="16" font-weight="600" fill="#1C1917" text-anchor="middle">AI Extracts Notes</text>
  <!-- Waveform mini -->
  <rect x="340" y="190" width="12" height="30" rx="6" fill="#0D9488" opacity="0.6"/>
  <rect x="360" y="180" width="12" height="50" rx="6" fill="#0D9488" opacity="0.8"/>
  <rect x="380" y="195" width="12" height="20" rx="6" fill="#0D9488"/>
  <rect x="400" y="175" width="12" height="60" rx="6" fill="#0D9488" opacity="0.9"/>
  <rect x="420" y="185" width="12" height="40" rx="6" fill="#0D9488" opacity="0.7"/>
  <rect x="440" y="200" width="12" height="15" rx="6" fill="#0D9488" opacity="0.5"/>
  <rect x="460" y="190" width="12" height="30" rx="6" fill="#0D9488" opacity="0.6"/>
  <!-- Arrow -->
  <path d="M530 170 L560 170" stroke="#C8B8A8" stroke-width="3"/>
  <path d="M555 165 L562 170 L555 175" fill="none" stroke="#C8B8A8" stroke-width="3"/>
  <!-- Step 3: Download -->
  <rect x="570" y="70" width="200" height="200" rx="16" fill="#fff" stroke="#E7E5E4" stroke-width="1"/>
  <circle cx="670" cy="110" r="28" fill="#D97706"/>
  <text x="670" y="118" font-family="DM Sans, Arial" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="670" y="165" font-family="DM Sans, Arial" font-size="16" font-weight="600" fill="#1C1917" text-anchor="middle">Download MIDI</text>
  <rect x="620" y="185" width="100" height="40" rx="8" fill="#D97706"/>
  <text x="670" y="210" font-family="JetBrains Mono, Arial" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">.mid</text>
  <!-- Bottom -->
  <rect x="200" y="300" width="400" height="50" rx="12" fill="#EA580C"/>
  <text x="400" y="330" font-family="DM Sans, Arial" font-size="16" font-weight="600" fill="#fff" text-anchor="middle">Under 15 seconds · No upload · 100% private</text>
</svg>
