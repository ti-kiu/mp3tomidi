<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" rx="16" fill="#FDF8F3"/>
  <text x="400" y="40" font-family="Space Grotesk, Arial" font-size="22" font-weight="700" fill="#1C1917" text-anchor="middle">Works with Every DAW</text>
  <!-- DAW cards -->
  <rect x="40" y="70" width="170" height="100" rx="14" fill="#fff" stroke="#FCD34D" stroke-width="2"/>
  <text x="125" y="110" font-family="DM Sans, Arial" font-size="18" font-weight="700" fill="#B45309" text-anchor="middle">Ableton</text>
  <text x="125" y="135" font-family="DM Sans, Arial" font-size="11" fill="#78716C" text-anchor="middle">Live Suite</text>
  <rect x="230" y="70" width="170" height="100" rx="14" fill="#fff" stroke="#FCD34D" stroke-width="2"/>
  <text x="315" y="110" font-family="DM Sans, Arial" font-size="18" font-weight="700" fill="#B45309" text-anchor="middle">FL Studio</text>
  <text x="315" y="135" font-family="DM Sans, Arial" font-size="11" fill="#78716C" text-anchor="middle">Producer Edition</text>
  <rect x="420" y="70" width="170" height="100" rx="14" fill="#fff" stroke="#FCD34D" stroke-width="2"/>
  <text x="505" y="110" font-family="DM Sans, Arial" font-size="18" font-weight="700" fill="#B45309" text-anchor="middle">Logic Pro</text>
  <text x="505" y="135" font-family="DM Sans, Arial" font-size="11" fill="#78716C" text-anchor="middle">macOS</text>
  <rect x="610" y="70" width="150" height="100" rx="14" fill="#fff" stroke="#FCD34D" stroke-width="2"/>
  <text x="685" y="110" font-family="DM Sans, Arial" font-size="18" font-weight="700" fill="#B45309" text-anchor="middle">Cubase</text>
  <text x="685" y="135" font-family="DM Sans, Arial" font-size="11" fill="#78716C" text-anchor="middle">Pro</text>
  <!-- Arrow from DAW to MIDI file -->
  <path d="M400 190 L400 220" stroke="#C8B8A8" stroke-width="3"/>
  <path d="M395 215 L400 222 L405 215" fill="none" stroke="#C8B8A8" stroke-width="3"/>
  <!-- MIDI file icon -->
  <rect x="300" y="230" width="200" height="80" rx="14" fill="#EA580C"/>
  <text x="400" y="265" font-family="JetBrains Mono, Arial" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">.mid</text>
  <text x="400" y="295" font-family="DM Sans, Arial" font-size="12" fill="#FDE68A" text-anchor="middle">Standard MIDI File</text>
  <!-- Bottom row: more DAWs -->
  <rect x="100" y="340" width="120" height="36" rx="10" fill="#F5F5F4" stroke="#E7E5E4" stroke-width="1"/>
  <text x="160" y="363" font-family="DM Sans, Arial" font-size="13" fill="#78716C" text-anchor="middle">GarageBand</text>
  <rect x="240" y="340" width="120" height="36" rx="10" fill="#F5F5F4" stroke="#E7E5E4" stroke-width="1"/>
  <text x="300" y="363" font-family="DM Sans, Arial" font-size="13" fill="#78716C" text-anchor="middle">Reaper</text>
  <rect x="380" y="340" width="120" height="36" rx="10" fill="#F5F5F4" stroke="#E7E5E4" stroke-width="1"/>
  <text x="440" y="363" font-family="DM Sans, Arial" font-size="13" fill="#78716C" text-anchor="middle">Pro Tools</text>
  <rect x="520" y="340" width="120" height="36" rx="10" fill="#F5F5F4" stroke="#E7E5E4" stroke-width="1"/>
  <text x="580" y="363" font-family="DM Sans, Arial" font-size="13" fill="#78716C" text-anchor="middle">Studio One</text>
</svg>
