<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDF8F3"/>
      <stop offset="100%" style="stop-color:#F5EDE4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EA580C"/>
      <stop offset="100%" style="stop-color:#F97316"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative -->
  <circle cx="1050" cy="550" r="180" fill="#EA580C" opacity="0.05"/>
  <circle cx="150" cy="80" r="100" fill="#C8B8A8" opacity="0.08"/>
  <!-- Piano keys illustration -->
  <g transform="translate(600,160)">
    <!-- White keys -->
    <rect x="-180" y="-30" width="36" height="90" rx="0 0 4 4" fill="#fff" stroke="#D4C8BC" stroke-width="1"/>
    <rect x="-144" y="-30" width="36" height="90" fill="#fff" stroke="#D4C8BC" stroke-width="1"/>
    <rect x="-108" y="-30" width="36" height="90" fill="#fff" stroke="#D4C8BC" stroke-width="1"/>
    <rect x="-72" y="-30" width="36" height="90" fill="#fff" stroke="#D4C8BC" stroke-width="1"/>
    <rect x="-36" y="-30" width="36" height="90" fill="#fff" stroke="#D4C8BC" stroke-width="1"/>
    <rect x="0" y="-30" width="36" height="90" fill="#fff" stroke="#D4C8BC" stroke-width="1"/>
    <rect x="36" y="-30" width="36" height="90" fill="#fff" stroke="#D4C8BC" stroke-width="1"/>
    <rect x="72" y="-30" width="36" height="90" fill="#fff" stroke="#D4C8BC" stroke-width="1"/>
    <rect x="108" y="-30" width="36" height="90" fill="#fff" stroke="#D4C8BC" stroke-width="1"/>
    <rect x="144" y="-30" width="36" height="90" fill="#fff" stroke="#D4C8BC" stroke-width="1"/>
    <!-- Black keys -->
    <rect x="-130" y="-30" width="24" height="55" rx="2" fill="#2D2319"/>
    <rect x="-94" y="-30" width="24" height="55" rx="2" fill="#2D2319"/>
    <rect x="-22" y="-30" width="24" height="55" rx="2" fill="#2D2319"/>
    <rect x="14" y="-30" width="24" height="55" rx="2" fill="#2D2319"/>
    <rect x="50" y="-30" width="24" height="55" rx="2" fill="#2D2319"/>
    <rect x="122" y="-30" width="24" height="55" rx="2" fill="#2D2319"/>
    <!-- Highlighted key (note extraction) -->
    <rect x="0" y="-30" width="36" height="90" fill="#EA580C" opacity="0.3" rx="2"/>
    <!-- Sound wave lines -->
    <g transform="translate(0,80)" opacity="0.4">
      <line x1="-120" y1="0" x2="-120" y2="-20" stroke="#EA580C" stroke-width="2" stroke-linecap="round"/>
      <line x1="-105" y1="0" x2="-105" y2="-30" stroke="#EA580C" stroke-width="2" stroke-linecap="round"/>
      <line x1="-90" y1="0" x2="-90" y2="-15" stroke="#EA580C" stroke-width="2" stroke-linecap="round"/>
      <line x1="-75" y1="0" x2="-75" y2="-35" stroke="#EA580C" stroke-width="2" stroke-linecap="round"/>
      <line x1="-60" y1="0" x2="-60" y2="-20" stroke="#EA580C" stroke-width="2" stroke-linecap="round"/>
      <line x1="-45" y1="0" x2="-45" y2="-25" stroke="#EA580C" stroke-width="2" stroke-linecap="round"/>
      <line x1="-30" y1="0" x2="-30" y2="-40" stroke="#EA580C" stroke-width="2" stroke-linecap="round"/>
      <line x1="-15" y1="0" x2="-15" y2="-22" stroke="#EA580C" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="0" y2="-30" stroke="#EA580C" stroke-width="2" stroke-linecap="round"/>
      <line x1="15" y1="0" x2="15" y2="-18" stroke="#EA580C" stroke-width="2" stroke-linecap="round"/>
      <line x1="30" y1="0" x2="30" y2="-28" stroke="#EA580C" stroke-width="2" stroke-linecap="round"/>
      <line x1="45" y1="0" x2="45" y2="-35" stroke="#EA580C" stroke-width="2" stroke-linecap="round"/>
      <line x1="60" y1="0" x2="60" y2="-15" stroke="#EA580C" stroke-width="2" stroke-linecap="round"/>
      <line x1="75" y1="0" x2="75" y2="-25" stroke="#EA580C" stroke-width="2" stroke-linecap="round"/>
      <line x1="90" y1="0" x2="90" y2="-20" stroke="#EA580C" stroke-width="2" stroke-linecap="round"/>
      <line x1="105" y1="0" x2="105" y2="-32" stroke="#EA580C" stroke-width="2" stroke-linecap="round"/>
      <line x1="120" y1="0" x2="120" y2="-18" stroke="#EA580C" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
  <!-- Title -->
  <text x="600" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="50" fill="#2D2319" font-weight="800">Extract Piano Notes</text>
  <text x="600" y="400" text-anchor="middle" font-family="system-ui, sans-serif" font-size="50" fill="#2D2319" font-weight="800">from Any Audio</text>
  <!-- Subtitle -->
  <text x="600" y="455" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#8B7355">3 proven methods — from AI-powered to manual transcription</text>
  <!-- Brand -->
  <rect x="490" y="520" width="220" height="44" rx="22" fill="url(#accent)"/>
  <text x="600" y="548" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#fff" font-weight="600">mp3tomidi.vip</text>
</svg>