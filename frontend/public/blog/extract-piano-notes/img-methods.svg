<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDF8F3"/>
      <stop offset="100%" style="stop-color:#F5EDE4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="system-ui" font-size="20" fill="#2D2319" font-weight="700">3 Methods to Extract Piano Notes</text>
  <!-- Method 1: AI Online Tool -->
  <rect x="30" y="65" width="230" height="310" rx="14" fill="#fff" stroke="#E5DDD4" stroke-width="1.5"/>
  <rect x="30" y="65" width="230" height="50" rx="14" fill="#EA580C"/>
  <rect x="30" y="101" width="230" height="14" fill="#EA580C"/>
  <text x="145" y="98" text-anchor="middle" font-family="system-ui" font-size="16" fill="#fff" font-weight="700">AI Online Tool</text>
  <!-- Stars -->
  <text x="145" y="145" text-anchor="middle" font-family="system-ui" font-size="14" fill="#F97316">★★★★★</text>
  <text x="145" y="165" text-anchor="middle" font-family="system-ui" font-size="11" fill="#8B7355">Accuracy</text>
  <!-- Features -->
  <text x="60" y="195" font-family="system-ui" font-size="12" fill="#2D2319">✓ Upload audio directly</text>
  <text x="60" y="218" font-family="system-ui" font-size="12" fill="#2D2319">✓ AI separates instruments</text>
  <text x="60" y="241" font-family="system-ui" font-size="12" fill="#2D2319">✓ Instant MIDI download</text>
  <text x="60" y="264" font-family="system-ui" font-size="12" fill="#2D2319">✓ Piano roll preview</text>
  <text x="60" y="287" font-family="system-ui" font-size="12" fill="#2D2319">✓ No install needed</text>
  <!-- Best for -->
  <rect x="50" y="310" width="190" height="50" rx="10" fill="#EA580C" opacity="0.1"/>
  <text x="145" y="335" text-anchor="middle" font-family="system-ui" font-size="12" fill="#EA580C" font-weight="600">Best for: Quick results</text>
  <text x="145" y="352" text-anchor="middle" font-family="system-ui" font-size="11" fill="#8B7355">mp3tomidi.vip</text>

  <!-- Method 2: Desktop Software -->
  <rect x="285" y="65" width="230" height="310" rx="14" fill="#fff" stroke="#E5DDD4" stroke-width="1.5"/>
  <rect x="285" y="65" width="230" height="50" rx="14" fill="#C8B8A8"/>
  <rect x="285" y="101" width="230" height="14" fill="#C8B8A8"/>
  <text x="400" y="98" text-anchor="middle" font-family="system-ui" font-size="16" fill="#fff" font-weight="700">Desktop Software</text>
  <text x="400" y="145" text-anchor="middle" font-family="system-ui" font-size="14" fill="#C8B8A8">★★★★☆</text>
  <text x="400" y="165" text-anchor="middle" font-family="system-ui" font-size="11" fill="#8B7355">Accuracy</text>
  <text x="315" y="195" font-family="system-ui" font-size="12" fill="#2D2319">✓ Install required</text>
  <text x="315" y="218" font-family="system-ui" font-size="12" fill="#2D2319">✓ Full DAW integration</text>
  <text x="315" y="241" font-family="system-ui" font-size="12" fill="#2D2319">✓ Advanced settings</text>
  <text x="315" y="264" font-family="system-ui" font-size="12" fill="#2D2319">✓ Batch processing</text>
  <text x="315" y="287" font-family="system-ui" font-size="12" fill="#2D2319">✗ Paid (often $50+)</text>
  <rect x="305" y="310" width="190" height="50" rx="10" fill="#C8B8A8" opacity="0.2"/>
  <text x="400" y="335" text-anchor="middle" font-family="system-ui" font-size="12" fill="#8B7355" font-weight="600">Best for: Studio work</text>
  <text x="400" y="352" text-anchor="middle" font-family="system-ui" font-size="11" fill="#8B7355">Melodyne, Ableton</text>

  <!-- Method 3: Manual -->
  <rect x="540" y="65" width="230" height="310" rx="14" fill="#fff" stroke="#E5DDD4" stroke-width="1.5"/>
  <rect x="540" y="65" width="230" height="50" rx="14" fill="#2D2319"/>
  <rect x="540" y="101" width="230" height="14" fill="#2D2319"/>
  <text x="655" y="98" text-anchor="middle" font-family="system-ui" font-size="16" fill="#fff" font-weight="700">By Ear (Manual)</text>
  <text x="655" y="145" text-anchor="middle" font-family="system-ui" font-size="14" fill="#C8B8A8">★★★☆☆</text>
  <text x="655" y="165" text-anchor="middle" font-family="system-ui" font-size="11" fill="#8B7355">Accuracy</text>
  <text x="570" y="195" font-family="system-ui" font-size="12" fill="#2D2319">✓ No tools needed</text>
  <text x="570" y="218" font-family="system-ui" font-size="12" fill="#2D2319">✓ Train your ear</text>
  <text x="570" y="241" font-family="system-ui" font-size="12" fill="#2D2319">✗ Very time-consuming</text>
  <text x="570" y="264" font-family="system-ui" font-size="12" fill="#2D2319">✗ Needs music theory</text>
  <text x="570" y="287" font-family="system-ui" font-size="12" fill="#2D2319">✗ Human error likely</text>
  <rect x="560" y="310" width="190" height="50" rx="10" fill="#2D2319" opacity="0.08"/>
  <text x="655" y="335" text-anchor="middle" font-family="system-ui" font-size="12" fill="#8B7355" font-weight="600">Best for: Learning</text>
  <text x="655" y="352" text-anchor="middle" font-family="system-ui" font-size="11" fill="#8B7355">Music students</text>

  <!-- Winner indicator -->
  <circle cx="145" cy="60" r="14" fill="#EA580C"/>
  <text x="145" y="65" text-anchor="middle" font-family="system-ui" font-size="12" fill="#fff" font-weight="700">★</text>
</svg>