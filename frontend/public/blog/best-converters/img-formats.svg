<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDF8F3" rx="12"/>
  <text x="400" y="50" font-family="Arial" font-size="20" fill="#1C1917" text-anchor="middle" font-weight="700">Supported Audio Formats</text>
  <rect x="80" y="80" width="120" height="80" rx="12" fill="#EA580C" opacity="0.15" stroke="#EA580C" stroke-width="2"/>
  <text x="140" y="120" font-family="Arial" font-size="16" fill="#EA580C" text-anchor="middle" font-weight="700">.MP3</text>
  <text x="140" y="140" font-family="Arial" font-size="11" fill="#78716C" text-anchor="middle">Compressed</text>
  <rect x="220" y="80" width="120" height="80" rx="12" fill="#0D9488" opacity="0.15" stroke="#0D9488" stroke-width="2"/>
  <text x="280" y="120" font-family="Arial" font-size="16" fill="#0D9488" text-anchor="middle" font-weight="700">.WAV</text>
  <text x="280" y="140" font-family="Arial" font-size="11" fill="#78716C" text-anchor="middle">Lossless</text>
  <rect x="360" y="80" width="120" height="80" rx="12" fill="#D97706" opacity="0.15" stroke="#D97706" stroke-width="2"/>
  <text x="420" y="120" font-family="Arial" font-size="16" fill="#D97706" text-anchor="middle" font-weight="700">.FLAC</text>
  <text x="420" y="140" font-family="Arial" font-size="11" fill="#78716C" text-anchor="middle">Lossless HD</text>
  <rect x="500" y="80" width="120" height="80" rx="12" fill="#E11D48" opacity="0.15" stroke="#E11D48" stroke-width="2"/>
  <text x="560" y="120" font-family="Arial" font-size="16" fill="#E11D48" text-anchor="middle" font-weight="700">.OGG</text>
  <text x="560" y="140" font-family="Arial" font-size="11" fill="#78716C" text-anchor="middle">Open Source</text>
  <rect x="640" y="80" width="120" height="80" rx="12" fill="#7C3AED" opacity="0.15" stroke="#7C3AED" stroke-width="2"/>
  <text x="700" y="120" font-family="Arial" font-size="16" fill="#7C3AED" text-anchor="middle" font-weight="700">.M4A</text>
  <text x="700" y="140" font-family="Arial" font-size="11" fill="#78716C" text-anchor="middle">Apple</text>
  <text x="400" y="220" font-family="Arial" font-size="32" fill="#C8B8A8" text-anchor="middle">↓ ↓ ↓ ↓ ↓</text>
  <rect x="280" y="260" width="240" height="80" rx="12" fill="#EA580C" opacity="0.1" stroke="#EA580C" stroke-width="2"/>
  <text x="400" y="305" font-family="Arial" font-size="20" fill="#EA580C" text-anchor="middle" font-weight="700">→ .MIDI ←</text>
</svg>