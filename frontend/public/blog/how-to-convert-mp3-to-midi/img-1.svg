<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDF8F3"/>
  <text x="400" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#1a1a1a">What Is MIDI? Audio vs MIDI Explained</text>
  <!-- Audio waveform -->
  <rect x="40" y="80" width="340" height="280" rx="12" fill="white" stroke="#C8B8A8" stroke-width="2"/>
  <text x="210" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1a1a1a">MP3 Audio</text>
  <polyline points="60,200 90,180 120,220 150,170 180,210 210,160 240,230 270,180 300,200 330,175 360,195" fill="none" stroke="#C8B8A8" stroke-width="2"/>
  <text x="210" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">Contains sound waves</text>
  <text x="210" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">Large file (3-5MB)</text>
  <text x="210" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">Plays directly</text>
  <!-- MIDI notes -->
  <rect x="420" y="80" width="340" height="280" rx="12" fill="white" stroke="#EA580C" stroke-width="2"/>
  <text x="590" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#EA580C">MIDI</text>
  <rect x="440" y="170" width="40" height="20" rx="2" fill="#EA580C"/>
  <rect x="490" y="150" width="40" height="40" rx="2" fill="#EA580C"/>
  <rect x="540" y="180" width="40" height="10" rx="2" fill="#EA580C"/>
  <rect x="590" y="140" width="40" height="50" rx="2" fill="#EA580C"/>
  <rect x="640" y="160" width="40" height="30" rx="2" fill="#EA580C"/>
  <rect x="690" y="175" width="40" height="15" rx="2" fill="#EA580C"/>
  <text x="590" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">Contains note data</text>
  <text x="590" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">Tiny file (~50KB)</text>
  <text x="590" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">Needs instrument</text>
</svg>