<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDF8F3"/>
  <text x="400" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#1a1a1a">Step-by-Step: MP3 to MIDI Conversion</text>
  <!-- Step 1 -->
  <circle cx="100" cy="120" r="25" fill="#EA580C"/>
  <text x="100" y="127" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="white">1</text>
  <text x="145" y="115" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1a1a1a">Upload your MP3</text>
  <text x="145" y="135" font-family="system-ui, sans-serif" font-size="12" fill="#6b7280">Drag & drop or click to browse</text>
  <!-- Step 2 -->
  <circle cx="100" cy="200" r="25" fill="#EA580C"/>
  <text x="100" y="207" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="white">2</text>
  <text x="145" y="195" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1a1a1a">AI analyzes audio</text>
  <text x="145" y="215" font-family="system-ui, sans-serif" font-size="12" fill="#6b7280">Detects notes, timing, velocity</text>
  <!-- Step 3 -->
  <circle cx="100" cy="280" r="25" fill="#EA580C"/>
  <text x="100" y="287" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="white">3</text>
  <text x="145" y="275" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1a1a1a">Download MIDI file</text>
  <text x="145" y="295" font-family="system-ui, sans-serif" font-size="12" fill="#6b7280">Standard .mid format</text>
  <!-- Arrow connectors -->
  <line x1="100" y1="145" x2="100" y2="175" stroke="#C8B8A8" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="100" y1="225" x2="100" y2="255" stroke="#C8B8A8" stroke-width="2" stroke-dasharray="5,5"/>
  <!-- Time estimate -->
  <rect x="500" y="100" width="250" height="200" rx="12" fill="white" stroke="#EA580C" stroke-width="2"/>
  <text x="625" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#EA580C">Total time</text>
  <text x="625" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="48" font-weight="700" fill="#EA580C">~5s</text>
  <text x="625" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">for a 3-minute song</text>
  <text x="625" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">100% browser-side</text>
</svg>