<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDF8F3"/>
  <rect x="20" y="20" width="760" height="360" rx="16" fill="white" stroke="#C8B8A8" stroke-width="1.5"/>
  <text x="400" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#2D2319">Which Format Should You Use?</text>
  <!-- Start diamond -->
  <polygon points="400,90 470,130 400,170 330,130" fill="#EA580C" stroke="white" stroke-width="2"/>
  <text x="400" y="134" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="white">Have WAV?</text>
  <!-- Yes path -->
  <line x1="470" y1="130" x2="560" y2="130" stroke="#1A7A3A" stroke-width="2"/>
  <text x="515" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1A7A3A">Yes</text>
  <rect x="560" y="105" width="160" height="50" rx="10" fill="#F0F7F3" stroke="#1A7A3A" stroke-width="1.5"/>
  <text x="640" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1A7A3A">Use WAV ✓</text>
  <text x="640" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7A6B5D">Best accuracy</text>
  <!-- No path down -->
  <line x1="400" y1="170" x2="400" y2="200" stroke="#EA580C" stroke-width="2"/>
  <text x="415" y="190" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#EA580C">No</text>
  <!-- Second question -->
  <polygon points="400,200 470,240 400,280 330,240" fill="#C8B8A8" stroke="white" stroke-width="2"/>
  <text x="400" y="237" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="white">File size</text>
  <text x="400" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="white">matters?</text>
  <!-- Yes to MP3 -->
  <line x1="470" y1="240" x2="560" y2="240" stroke="#1A7A3A" stroke-width="2"/>
  <text x="515" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1A7A3A">Yes</text>
  <rect x="560" y="215" width="160" height="50" rx="10" fill="#FEF3E2" stroke="#EA580C" stroke-width="1.5"/>
  <text x="640" y="238" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#EA580C">Use MP3 256+</text>
  <text x="640" y="255" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7A6B5D">Good accuracy</text>
  <!-- No path down -->
  <line x1="400" y1="280" x2="400" y2="310" stroke="#EA580C" stroke-width="2"/>
  <text x="415" y="300" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#EA580C">No</text>
  <rect x="310" y="310" width="180" height="50" rx="10" fill="#EA580C"/>
  <text x="400" y="333" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="white">Either works fine</text>
  <text x="400" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.8)">WAV for best results</text>
  <!-- Avoid box -->
  <rect x="80" y="310" width="160" height="50" rx="10" fill="#FEF0E0" stroke="#D97706" stroke-width="1.5"/>
  <text x="160" y="333" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#D97706">Avoid &lt;128kbps</text>
  <text x="160" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7A6B5D">Poor MIDI results</text>
</svg>