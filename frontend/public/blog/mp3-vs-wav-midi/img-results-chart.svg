<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDF8F3"/>
  <rect x="20" y="20" width="760" height="360" rx="16" fill="white" stroke="#C8B8A8" stroke-width="1.5"/>
  <text x="400" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#2D2319">WAV vs MP3: Accuracy by Instrument</text>
  <!-- Legend -->
  <rect x="260" y="72" width="14" height="14" rx="3" fill="#1A7A3A"/>
  <text x="280" y="84" font-family="system-ui, sans-serif" font-size="13" fill="#2D2319">WAV</text>
  <rect x="330" y="72" width="14" height="14" rx="3" fill="#EA580C"/>
  <text x="350" y="84" font-family="system-ui, sans-serif" font-size="13" fill="#2D2319">MP3 320kbps</text>
  <rect x="460" y="72" width="14" height="14" rx="3" fill="#C8B8A8"/>
  <text x="480" y="84" font-family="system-ui, sans-serif" font-size="13" fill="#2D2319">MP3 128kbps</text>
  <!-- Y axis -->
  <text x="75" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#7A6B5D" transform="rotate(-90,75,220)">Accuracy %</text>
  <!-- Grid lines -->
  <line x1="100" y1="110" x2="720" y2="110" stroke="#E8E0D8" stroke-width="0.5"/>
  <line x1="100" y1="165" x2="720" y2="165" stroke="#E8E0D8" stroke-width="0.5"/>
  <line x1="100" y1="220" x2="720" y2="220" stroke="#E8E0D8" stroke-width="0.5"/>
  <line x1="100" y1="275" x2="720" y2="275" stroke="#E8E0D8" stroke-width="0.5"/>
  <line x1="100" y1="330" x2="720" y2="330" stroke="#E8E0D8" stroke-width="0.5"/>
  <!-- Y labels -->
  <text x="90" y="114" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#7A6B5D">100%</text>
  <text x="90" y="169" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#7A6B5D">75%</text>
  <text x="90" y="224" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#7A6B5D">50%</text>
  <text x="90" y="279" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#7A6B5D">25%</text>
  <text x="90" y="334" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#7A6B5D">0%</text>
  <!-- Piano: WAV=95 MP3-320=91 MP3-128=78 -->
  <text x="190" y="352" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#2D2319">Piano</text>
  <rect x="130" y="132" width="30" height="198" rx="4" fill="#1A7A3A"/>
  <rect x="165" y="150" width="30" height="180" rx="4" fill="#EA580C"/>
  <rect x="200" y="208" width="30" height="122" rx="4" fill="#C8B8A8"/>
  <!-- Guitar: WAV=88 MP3-320=82 MP3-128=65 -->
  <text x="340" y="352" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#2D2319">Guitar</text>
  <rect x="280" y="163" width="30" height="167" rx="4" fill="#1A7A3A"/>
  <rect x="315" y="190" width="30" height="140" rx="4" fill="#EA580C"/>
  <rect x="350" y="263" width="30" height="67" rx="4" fill="#C8B8A8"/>
  <!-- Vocal: WAV=82 MP3-320=76 MP3-128=55 -->
  <text x="490" y="352" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#2D2319">Vocal</text>
  <rect x="430" y="190" width="30" height="140" rx="4" fill="#1A7A3A"/>
  <rect x="465" y="217" width="30" height="113" rx="4" fill="#EA580C"/>
  <rect x="500" y="309" width="30" height="21" rx="4" fill="#C8B8A8"/>
  <!-- Full mix: WAV=75 MP3-320=68 MP3-128=48 -->
  <text x="640" y="352" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#2D2319">Full Mix</text>
  <rect x="580" y="220" width="30" height="110" rx="4" fill="#1A7A3A"/>
  <rect x="615" y="252" width="30" height="78" rx="4" fill="#EA580C"/>
  <rect x="650" y="326" width="30" height="4" rx="4" fill="#C8B8A8"/>
</svg>