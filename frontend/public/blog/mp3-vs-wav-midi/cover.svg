<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#FDF8F3"/>
  <rect x="40" y="40" width="1120" height="550" rx="20" fill="white" stroke="#C8B8A8" stroke-width="2"/>
  <!-- Left side: MP3 -->
  <rect x="80" y="100" width="440" height="340" rx="16" fill="#FEF3E2" stroke="#C8B8A8" stroke-width="1.5"/>
  <text x="300" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#EA580C">MP3</text>
  <text x="300" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#7A6B5D">Compressed Audio</text>
  <!-- Compressed waveform -->
  <g transform="translate(130, 230)">
    <rect x="0" y="40" width="340" height="80" rx="8" fill="white" stroke="#C8B8A8" stroke-width="1"/>
    <path d="M20,80 L30,60 L40,90 L50,50 L60,85 L70,65 L80,75 L90,55 L100,80 L110,60 L120,90 L130,55 L140,80 L150,65 L160,75 L170,55 L180,85 L190,60 L200,80 L210,70 L220,75 L230,65 L240,80 L250,55 L260,85 L270,70 L280,75 L290,60 L300,80 L310,70 L320,75" fill="none" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="300" y="365" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#7A6B5D">~1-5 MB per song</text>
  <text x="300" y="390" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#7A6B5D">Some detail lost</text>
  <!-- VS -->
  <text x="600" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="48" font-weight="800" fill="#C8B8A8">VS</text>
  <!-- Right side: WAV -->
  <rect x="680" y="100" width="440" height="340" rx="16" fill="#F0F7F3" stroke="#C8B8A8" stroke-width="1.5"/>
  <text x="900" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#1A7A3A">WAV</text>
  <text x="900" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#7A6B5D">Uncompressed Audio</text>
  <!-- Uncompressed waveform -->
  <g transform="translate(730, 230)">
    <rect x="0" y="40" width="340" height="80" rx="8" fill="white" stroke="#C8B8A8" stroke-width="1"/>
    <path d="M20,80 L25,55 L30,85 L35,50 L40,90 L45,45 L50,95 L55,50 L60,88 L65,52 L70,86 L75,58 L80,82 L85,55 L90,87 L95,53 L100,84 L105,57 L110,83 L115,54 L120,86 L125,50 L130,90 L135,52 L140,88 L145,56 L150,84 L155,58 L160,82 L165,54 L170,86 L175,52 L180,88 L185,56 L190,84 L195,50 L200,90 L205,55 L210,85 L215,52 L220,88 L225,58 L230,82 L235,54 L240,86 L245,50 L250,90 L255,55 L260,85 L265,52 L270,88 L275,56 L280,84 L285,58 L290,82 L295,54 L300,86 L305,55 L310,85 L315,52 L320,88" fill="none" stroke="#1A7A3A" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="900" y="365" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#7A6B5D">~30-50 MB per song</text>
  <text x="900" y="390" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#7A6B5D">Full detail preserved</text>
  <!-- Bottom tagline -->
  <text x="600" y="500" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="600" fill="#2D2319">Which is better for MIDI conversion?</text>
  <text x="600" y="540" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#7A6B5D">mp3tomidi.vip</text>
</svg>