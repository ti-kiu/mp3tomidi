<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDF8F3"/>
  <rect x="20" y="20" width="760" height="360" rx="16" fill="white" stroke="#C8B8A8" stroke-width="1.5"/>
  <text x="400" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#2D2319">Test Setup</text>
  <!-- Source -->
  <rect x="300" y="80" width="200" height="50" rx="10" fill="#EA580C"/>
  <text x="400" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="white">Original Track</text>
  <!-- Arrows down -->
  <path d="M350,130 L350,155" stroke="#C8B8A8" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M450,130 L450,155" stroke="#C8B8A8" stroke-width="2" marker-end="url(#arrowhead)"/>
  <defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="5" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#C8B8A8"/></marker></defs>
  <!-- Two paths -->
  <rect x="120" y="160" width="200" height="50" rx="10" fill="#F0F7F3" stroke="#1A7A3A" stroke-width="1.5"/>
  <text x="220" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1A7A3A">Export as WAV</text>
  <rect x="480" y="160" width="200" height="50" rx="10" fill="#FEF3E2" stroke="#EA580C" stroke-width="1.5"/>
  <text x="580" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#EA580C">Export as MP3</text>
  <!-- Arrows -->
  <path d="M220,210 L220,235" stroke="#C8B8A8" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M580,210 L580,235" stroke="#C8B8A8" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Converter -->
  <rect x="140" y="240" width="160" height="45" rx="8" fill="white" stroke="#C8B8A8" stroke-width="1.5"/>
  <text x="220" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#2D2319">MIDI Converter</text>
  <rect x="500" y="240" width="160" height="45" rx="8" fill="white" stroke="#C8B8A8" stroke-width="1.5"/>
  <text x="580" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#2D2319">MIDI Converter</text>
  <!-- Results -->
  <path d="M220,285 L220,310" stroke="#C8B8A8" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M580,285 L580,310" stroke="#C8B8A8" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="120" y="315" width="200" height="45" rx="10" fill="#F0F7F3" stroke="#1A7A3A" stroke-width="1.5"/>
  <text x="220" y="343" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1A7A3A">MIDI A</text>
  <rect x="480" y="315" width="200" height="45" rx="10" fill="#FEF3E2" stroke="#EA580C" stroke-width="1.5"/>
  <text x="580" y="343" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#EA580C">MIDI B</text>
</svg>