<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDF8F3" rx="12"/>
  <text x="400" y="50" font-family="Arial" font-size="20" fill="#1C1917" text-anchor="middle" font-weight="700">MIDI Piano Roll Preview</text>
  <rect x="60" y="80" width="680" height="280" fill="#fff" rx="8" stroke="#E7E5E4" stroke-width="1"/>
  <!-- Grid lines -->
  <line x1="60" y1="140" x2="740" y2="140" stroke="#F5F5F4" stroke-width="1"/>
  <line x1="60" y1="200" x2="740" y2="200" stroke="#F5F5F4" stroke-width="1"/>
  <line x1="60" y1="260" x2="740" y2="260" stroke="#F5F5F4" stroke-width="1"/>
  <line x1="60" y1="320" x2="740" y2="320" stroke="#F5F5F4" stroke-width="1"/>
  <!-- Notes -->
  <rect x="100" y="110" width="80" height="20" rx="4" fill="#EA580C" opacity="0.8"/>
  <rect x="200" y="160" width="120" height="20" rx="4" fill="#0D9488" opacity="0.8"/>
  <rect x="340" y="130" width="60" height="20" rx="4" fill="#D97706" opacity="0.8"/>
  <rect x="420" y="190" width="100" height="20" rx="4" fill="#EA580C" opacity="0.7"/>
  <rect x="540" y="150" width="90" height="20" rx="4" fill="#0D9488" opacity="0.7"/>
  <rect x="200" y="220" width="140" height="20" rx="4" fill="#D97706" opacity="0.6"/>
  <rect x="400" y="250" width="110" height="20" rx="4" fill="#EA580C" opacity="0.6"/>
  <rect x="560" y="280" width="70" height="20" rx="4" fill="#0D9488" opacity="0.6"/>
  <rect x="100" y="290" width="100" height="20" rx="4" fill="#D97706" opacity="0.5"/>
  <rect x="650" y="200" width="60" height="20" rx="4" fill="#EA580C" opacity="0.5"/>
</svg>