<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDF8F3" rx="16"/>
  <rect x="40" y="30" width="720" height="340" rx="12" fill="white" stroke="#F5E6D3" stroke-width="1.5"/>
  <text x="400" y="68" font-family="Arial, sans-serif" font-size="22" fill="#1C1917" font-weight="700" text-anchor="middle">Online vs Desktop Software</text>

  <!-- Table header -->
  <rect x="60" y="85" width="680" height="36" rx="6" fill="#FFF7ED"/>
  <text x="180" y="109" font-family="Arial, sans-serif" font-size="13" fill="#78716C" font-weight="600" text-anchor="middle">Feature</text>
  <text x="430" y="109" font-family="Arial, sans-serif" font-size="13" fill="#EA580C" font-weight="700" text-anchor="middle">Online (Ours)</text>
  <text x="640" y="109" font-family="Arial, sans-serif" font-size="13" fill="#78716C" font-weight="600" text-anchor="middle">Desktop App</text>

  <!-- Row 1: No Install -->
  <line x1="60" y1="128" x2="740" y2="128" stroke="#F5E6D3" stroke-width="0.75"/>
  <text x="180" y="152" font-family="Arial, sans-serif" font-size="14" fill="#1C1917" text-anchor="middle">No Install Needed</text>
  <!-- Checkmark for online -->
  <circle cx="430" cy="148" r="12" fill="#DCFCE7"/>
  <text x="430" y="153" font-family="Arial, sans-serif" font-size="16" fill="#16A34A" font-weight="700" text-anchor="middle">✓</text>
  <!-- X for desktop -->
  <circle cx="640" cy="148" r="12" fill="#FEE2E2"/>
  <text x="640" y="153" font-family="Arial, sans-serif" font-size="16" fill="#DC2626" font-weight="700" text-anchor="middle">✕</text>

  <!-- Row 2: Free -->
  <line x1="60" y1="170" x2="740" y2="170" stroke="#F5E6D3" stroke-width="0.75"/>
  <text x="180" y="194" font-family="Arial, sans-serif" font-size="14" fill="#1C1917" text-anchor="middle">100% Free</text>
  <circle cx="430" cy="190" r="12" fill="#DCFCE7"/>
  <text x="430" y="195" font-family="Arial, sans-serif" font-size="16" fill="#16A34A" font-weight="700" text-anchor="middle">✓</text>
  <circle cx="640" cy="190" r="12" fill="#FEE2E2"/>
  <text x="640" y="195" font-family="Arial, sans-serif" font-size="16" fill="#DC2626" font-weight="700" text-anchor="middle">✕</text>

  <!-- Row 3: Cross-Platform -->
  <line x1="60" y1="212" x2="740" y2="212" stroke="#F5E6D3" stroke-width="0.75"/>
  <text x="180" y="236" font-family="Arial, sans-serif" font-size="14" fill="#1C1917" text-anchor="middle">Cross-Platform</text>
  <circle cx="430" cy="232" r="12" fill="#DCFCE7"/>
  <text x="430" y="237" font-family="Arial, sans-serif" font-size="16" fill="#16A34A" font-weight="700" text-anchor="middle">✓</text>
  <circle cx="640" cy="232" r="12" fill="#FEF9C3"/>
  <text x="640" y="237" font-family="Arial, sans-serif" font-size="14" fill="#CA8A04" font-weight="700" text-anchor="middle">~</text>

  <!-- Row 4: Privacy (Local Processing) -->
  <line x1="60" y1="254" x2="740" y2="254" stroke="#F5E6D3" stroke-width="0.75"/>
  <text x="180" y="278" font-family="Arial, sans-serif" font-size="14" fill="#1C1917" text-anchor="middle">Data Stays Private</text>
  <circle cx="430" cy="274" r="12" fill="#DCFCE7"/>
  <text x="430" y="279" font-family="Arial, sans-serif" font-size="16" fill="#16A34A" font-weight="700" text-anchor="middle">✓</text>
  <circle cx="640" cy="274" r="12" fill="#DCFCE7"/>
  <text x="640" y="279" font-family="Arial, sans-serif" font-size="16" fill="#16A34A" font-weight="700" text-anchor="middle">✓</text>

  <!-- Row 5: Updates -->
  <line x1="60" y1="296" x2="740" y2="296" stroke="#F5E6D3" stroke-width="0.75"/>
  <text x="180" y="320" font-family="Arial, sans-serif" font-size="14" fill="#1C1917" text-anchor="middle">Always Up-to-Date</text>
  <circle cx="430" cy="316" r="12" fill="#DCFCE7"/>
  <text x="430" y="321" font-family="Arial, sans-serif" font-size="16" fill="#16A34A" font-weight="700" text-anchor="middle">✓</text>
  <circle cx="640" cy="316" r="12" fill="#FEE2E2"/>
  <text x="640" y="321" font-family="Arial, sans-serif" font-size="16" fill="#DC2626" font-weight="700" text-anchor="middle">✕</text>

  <!-- Bottom label -->
  <text x="400" y="362" font-family="Arial, sans-serif" font-size="12" fill="#A8A29E" text-anchor="middle">Online wins on convenience — no install, no cost, works everywhere</text>
</svg>