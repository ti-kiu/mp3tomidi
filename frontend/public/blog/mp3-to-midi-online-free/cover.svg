<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#FDF8F3"/>
  <!-- Left accent bar -->
  <rect x="0" y="0" width="8" height="630" fill="#EA580C"/>
  <!-- Main card -->
  <rect x="80" y="60" width="1040" height="510" rx="24" fill="white" stroke="#F5E6D3" stroke-width="2"/>

  <!-- Blog logo area -->
  <circle cx="150" cy="130" r="32" fill="#FEF3C7"/>
  <text x="150" y="142" font-family="Arial, sans-serif" font-size="28" fill="#EA580C" text-anchor="middle">♪</text>
  <text x="198" y="138" font-family="Arial, sans-serif" font-size="16" fill="#78716C" font-weight="600">MP3toMIDI Blog</text>

  <!-- Title -->
  <text x="120" y="230" font-family="Arial, sans-serif" font-size="42" fill="#1C1917" font-weight="700">MP3 to MIDI Online Free</text>
  <!-- Subtitle -->
  <text x="120" y="275" font-family="Arial, sans-serif" font-size="22" fill="#78716C">No Download, No Signup — Works in Your Browser</text>

  <!-- CTA Button -->
  <rect x="120" y="300" width="200" height="48" rx="8" fill="#EA580C"/>
  <text x="220" y="330" font-family="Arial, sans-serif" font-size="18" fill="white" font-weight="600" text-anchor="middle">Read More →</text>

  <!-- Browser window illustration (right side) -->
  <rect x="620" y="140" width="440" height="320" rx="12" fill="#FFF7ED" stroke="#E7E0D8" stroke-width="2"/>
  <!-- Browser title bar -->
  <rect x="620" y="140" width="440" height="36" rx="12" fill="#F5E6D3"/>
  <rect x="620" y="164" width="440" height="12" fill="#F5E6D3"/>
  <!-- Traffic lights -->
  <circle cx="645" cy="158" r="5" fill="#EF4444"/>
  <circle cx="662" cy="158" r="5" fill="#F59E0B"/>
  <circle cx="679" cy="158" r="5" fill="#22C55E"/>
  <!-- URL bar -->
  <rect x="700" y="148" width="340" height="20" rx="4" fill="white" opacity="0.7"/>
  <text x="720" y="163" font-family="Arial, sans-serif" font-size="10" fill="#A8A29E">mp3tomidi.com</text>

  <!-- Drag-drop zone inside browser -->
  <rect x="660" y="200" width="360" height="180" rx="8" fill="white" stroke="#C8B8A8" stroke-width="2" stroke-dasharray="8,6"/>
  <!-- Upload arrow -->
  <line x1="840" y1="280" x2="840" y2="240" stroke="#EA580C" stroke-width="3" stroke-linecap="round"/>
  <polyline points="825,255 840,240 855,255" fill="none" stroke="#EA580C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- MP3 file icon -->
  <rect x="790" y="290" width="100" height="60" rx="6" fill="#FEF3C7" stroke="#EA580C" stroke-width="1.5"/>
  <text x="840" y="316" font-family="Arial, sans-serif" font-size="14" fill="#EA580C" font-weight="700" text-anchor="middle">♪ MP3</text>
  <text x="840" y="336" font-family="Arial, sans-serif" font-size="11" fill="#78716C" text-anchor="middle">song.mp3</text>
  <!-- Drop text -->
  <text x="840" y="370" font-family="Arial, sans-serif" font-size="13" fill="#A8A29E" text-anchor="middle">Drag &amp; drop your file here</text>

  <!-- MIDI output arrow -->
  <line x1="920" y1="420" x2="990" y2="420" stroke="#0D9488" stroke-width="2"/>
  <polyline points="980,413 990,420 980,427" fill="none" stroke="#0D9488" stroke-width="2"/>
  <rect x="995" y="405" width="50" height="30" rx="4" fill="#0D9488"/>
  <text x="1020" y="425" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="700" text-anchor="middle">.MID</text>

  <!-- Bottom decorative bar -->
  <rect x="620" y="440" width="440" height="6" rx="3" fill="#EA580C" opacity="0.15"/>
</svg>