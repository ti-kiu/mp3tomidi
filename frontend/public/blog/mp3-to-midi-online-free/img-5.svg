<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDF8F3" rx="16"/>
  <rect x="40" y="30" width="720" height="340" rx="12" fill="white" stroke="#F5E6D3" stroke-width="1.5"/>
  <text x="400" y="68" font-family="Arial, sans-serif" font-size="22" fill="#1C1917" font-weight="700" text-anchor="middle">Supported Audio Formats</text>

  <!-- Input format pills -->
  <!-- MP3 pill -->
  <rect x="100" y="110" width="120" height="50" rx="25" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  <text x="160" y="135" font-family="Arial, sans-serif" font-size="16" fill="#EA580C" font-weight="700" text-anchor="middle">♪ MP3</text>
  <text x="160" y="150" font-family="Arial, sans-serif" font-size="9" fill="#A8A29E" text-anchor="middle">MPEG Audio</text>

  <!-- WAV pill -->
  <rect x="240" y="110" width="120" height="50" rx="25" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  <text x="300" y="135" font-family="Arial, sans-serif" font-size="16" fill="#EA580C" font-weight="700" text-anchor="middle">♪ WAV</text>
  <text x="300" y="150" font-family="Arial, sans-serif" font-size="9" fill="#A8A29E" text-anchor="middle">Waveform</text>

  <!-- FLAC pill -->
  <rect x="380" y="110" width="120" height="50" rx="25" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  <text x="440" y="135" font-family="Arial, sans-serif" font-size="16" fill="#EA580C" font-weight="700" text-anchor="middle">♪ FLAC</text>
  <text x="440" y="150" font-family="Arial, sans-serif" font-size="9" fill="#A8A29E" text-anchor="middle">Lossless</text>

  <!-- OGG pill -->
  <rect x="520" y="110" width="120" height="50" rx="25" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  <text x="580" y="135" font-family="Arial, sans-serif" font-size="16" fill="#EA580C" font-weight="700" text-anchor="middle">♪ OGG</text>
  <text x="580" y="150" font-family="Arial, sans-serif" font-size="9" fill="#A8A29E" text-anchor="middle">Vorbis</text>

  <!-- M4A pill -->
  <rect x="170" y="175" width="120" height="50" rx="25" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  <text x="230" y="200" font-family="Arial, sans-serif" font-size="16" fill="#EA580C" font-weight="700" text-anchor="middle">♪ M4A</text>
  <text x="230" y="215" font-family="Arial, sans-serif" font-size="9" fill="#A8A29E" text-anchor="middle">AAC Audio</text>

  <!-- + More pill -->
  <rect x="310" y="175" width="120" height="50" rx="25" fill="#FFF7ED" stroke="#C8B8A8" stroke-width="2"/>
  <text x="370" y="200" font-family="Arial, sans-serif" font-size="16" fill="#78716C" font-weight="700" text-anchor="middle">+ More</text>
  <text x="370" y="215" font-family="Arial, sans-serif" font-size="9" fill="#A8A29E" text-anchor="middle">WebAudio API</text>

  <!-- Converging arrows -->
  <line x1="160" y1="235" x2="400" y2="280" stroke="#C8B8A8" stroke-width="2"/>
  <line x1="300" y1="235" x2="400" y2="280" stroke="#C8B8A8" stroke-width="2"/>
  <line x1="440" y1="235" x2="400" y2="280" stroke="#C8B8A8" stroke-width="2"/>
  <line x1="580" y1="235" x2="400" y2="280" stroke="#C8B8A8" stroke-width="2"/>
  <line x1="230" y1="235" x2="400" y2="280" stroke="#C8B8A8" stroke-width="2"/>
  <line x1="370" y1="235" x2="400" y2="280" stroke="#C8B8A8" stroke-width="2"/>

  <!-- Processing badge -->
  <rect x="340" y="268" width="120" height="30" rx="15" fill="#0D9488"/>
  <text x="400" y="288" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="700" text-anchor="middle">Convert</text>

  <!-- Output arrow -->
  <line x1="400" y1="298" x2="400" y2="320" stroke="#0D9488" stroke-width="2"/>

  <!-- MIDI output -->
  <rect x="320" y="320" width="160" height="45" rx="8" fill="#0D9488"/>
  <text x="400" y="340" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="800" text-anchor="middle">♫ .MID</text>
  <text x="400" y="358" font-family="Arial, sans-serif" font-size="11" fill="#CCFBF1" text-anchor="middle">Standard MIDI File</text>

  <!-- Decorative notes floating -->
  <text x="680" y="150" font-family="Arial, sans-serif" font-size="20" fill="#EA580C" opacity="0.3">♪</text>
  <text x="700" y="200" font-family="Arial, sans-serif" font-size="16" fill="#0D9488" opacity="0.3">♫</text>
  <text x="670" y="250" font-family="Arial, sans-serif" font-size="14" fill="#C8B8A8" opacity="0.4">♩</text>
</svg>