<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDF8F3" rx="16"/>
  <rect x="40" y="30" width="720" height="340" rx="12" fill="white" stroke="#F5E6D3" stroke-width="1.5"/>
  <text x="400" y="65" font-family="Arial, sans-serif" font-size="22" fill="#1C1917" font-weight="700" text-anchor="middle">Preview Detected Notes</text>

  <!-- Piano roll container -->
  <rect x="80" y="85" width="500" height="240" rx="6" fill="#1C1917"/>

  <!-- Piano keys (left side) -->
  <rect x="80" y="85" width="30" height="240" rx="0" fill="#2D2D2D"/>
  <!-- Key lines and labels -->
  <text x="95" y="108" font-family="monospace" font-size="9" fill="#A8A29E" text-anchor="middle">C5</text>
  <line x1="80" y1="115" x2="580" y2="115" stroke="#333" stroke-width="0.5"/>
  <text x="95" y="138" font-family="monospace" font-size="9" fill="#A8A29E" text-anchor="middle">B4</text>
  <line x1="80" y1="145" x2="580" y2="145" stroke="#333" stroke-width="0.5"/>
  <text x="95" y="168" font-family="monospace" font-size="9" fill="#A8A29E" text-anchor="middle">A4</text>
  <line x1="80" y1="175" x2="580" y2="175" stroke="#333" stroke-width="0.5"/>
  <text x="95" y="198" font-family="monospace" font-size="9" fill="#A8A29E" text-anchor="middle">G4</text>
  <line x1="80" y1="205" x2="580" y2="205" stroke="#333" stroke-width="0.5"/>
  <text x="95" y="228" font-family="monospace" font-size="9" fill="#A8A29E" text-anchor="middle">F4</text>
  <line x1="80" y1="235" x2="580" y2="235" stroke="#333" stroke-width="0.5"/>
  <text x="95" y="258" font-family="monospace" font-size="9" fill="#A8A29E" text-anchor="middle">E4</text>
  <line x1="80" y1="265" x2="580" y2="265" stroke="#333" stroke-width="0.5"/>
  <text x="95" y="288" font-family="monospace" font-size="9" fill="#A8A29E" text-anchor="middle">D4</text>
  <line x1="80" y1="295" x2="580" y2="295" stroke="#333" stroke-width="0.5"/>
  <text x="95" y="318" font-family="monospace" font-size="9" fill="#A8A29E" text-anchor="middle">C4</text>

  <!-- Beat grid lines -->
  <line x1="150" y1="85" x2="150" y2="325" stroke="#333" stroke-width="0.5"/>
  <line x1="220" y1="85" x2="220" y2="325" stroke="#333" stroke-width="0.5"/>
  <line x1="290" y1="85" x2="290" y2="325" stroke="#333" stroke-width="0.5"/>
  <line x1="360" y1="85" x2="360" y2="325" stroke="#333" stroke-width="0.5"/>
  <line x1="430" y1="85" x2="430" y2="325" stroke="#333" stroke-width="0.5"/>
  <line x1="500" y1="85" x2="500" y2="325" stroke="#333" stroke-width="0.5"/>

  <!-- Detected MIDI notes (colored rectangles) -->
  <!-- C5 notes -->
  <rect x="115" y="95" width="45" height="16" rx="3" fill="#0D9488"/>
  <rect x="290" y="95" width="60" height="16" rx="3" fill="#0D9488"/>
  <!-- B4 notes -->
  <rect x="160" y="125" width="35" height="16" rx="3" fill="#EA580C"/>
  <rect x="360" y="125" width="50" height="16" rx="3" fill="#EA580C"/>
  <!-- A4 notes -->
  <rect x="200" y="155" width="55" height="16" rx="3" fill="#0D9488"/>
  <rect x="430" y="155" width="40" height="16" rx="3" fill="#0D9488"/>
  <!-- G4 notes -->
  <rect x="130" y="185" width="70" height="16" rx="3" fill="#EA580C"/>
  <rect x="350" y="185" width="55" height="16" rx="3" fill="#EA580C"/>
  <rect x="500" y="185" width="35" height="16" rx="3" fill="#EA580C"/>
  <!-- F4 notes -->
  <rect x="250" y="215" width="45" height="16" rx="3" fill="#0D9488"/>
  <rect x="410" y="215" width="65" height="16" rx="3" fill="#0D9488"/>
  <!-- E4 notes -->
  <rect x="180" y="245" width="50" height="16" rx="3" fill="#EA580C"/>
  <rect x="320" y="245" width="40" height="16" rx="3" fill="#EA580C"/>
  <!-- D4 notes -->
  <rect x="115" y="275" width="30" height="16" rx="3" fill="#0D9488"/>
  <rect x="270" y="275" width="55" height="16" rx="3" fill="#0D9488"/>
  <rect x="470" y="275" width="45" height="16" rx="3" fill="#0D9488"/>

  <!-- Note count badge -->
  <rect x="440" y="92" width="130" height="28" rx="14" fill="#EA580C"/>
  <text x="505" y="111" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="600" text-anchor="middle">24 notes detected</text>

  <!-- Download button (right side) -->
  <g transform="translate(610, 130)">
    <rect x="0" y="0" width="130" height="130" rx="12" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
    <!-- Download arrow -->
    <line x1="65" y1="30" x2="65" y2="75" stroke="#EA580C" stroke-width="4" stroke-linecap="round"/>
    <polyline points="50,62 65,78 80,62" fill="none" stroke="#EA580C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Base line -->
    <line x1="40" y1="88" x2="90" y2="88" stroke="#EA580C" stroke-width="4" stroke-linecap="round"/>
    <!-- Label -->
    <text x="65" y="115" font-family="Arial, sans-serif" font-size="14" fill="#EA580C" font-weight="700" text-anchor="middle">Download</text>
  </g>

  <!-- File label -->
  <text x="675" y="285" font-family="Arial, sans-serif" font-size="13" fill="#1C1917" font-weight="600" text-anchor="middle">song.mid</text>
  <text x="675" y="305" font-family="Arial, sans-serif" font-size="11" fill="#A8A29E" text-anchor="middle">MIDI Type 0</text>

  <!-- Bottom text -->
  <text x="400" y="362" font-family="Arial, sans-serif" font-size="12" fill="#A8A29E" text-anchor="middle">Preview detected notes before downloading — adjust tempo and quantize settings</text>
</svg>