<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDF8F3" rx="16"/>
  <rect x="40" y="30" width="720" height="340" rx="12" fill="white" stroke="#F5E6D3" stroke-width="1.5"/>
  <text x="400" y="68" font-family="Arial, sans-serif" font-size="22" fill="#1C1917" font-weight="700" text-anchor="middle">Conversion Speed</text>

  <!-- Speedometer gauge -->
  <!-- Gauge background arc -->
  <path d="M 250 260 A 130 130 0 0 1 550 260" fill="none" stroke="#F5E6D3" stroke-width="20" stroke-linecap="round"/>
  <!-- Gauge filled arc (fast section in teal/orange) -->
  <path d="M 250 260 A 130 130 0 0 1 370 148" fill="none" stroke="#0D9488" stroke-width="20" stroke-linecap="round"/>
  <path d="M 370 148 A 130 130 0 0 1 430 140" fill="none" stroke="#EA580C" stroke-width="20" stroke-linecap="round"/>
  <!-- Slow section (faded) -->
  <path d="M 430 140 A 130 130 0 0 1 550 260" fill="none" stroke="#E7E0D8" stroke-width="20" stroke-linecap="round"/>

  <!-- Gauge labels -->
  <text x="235" y="285" font-family="Arial, sans-serif" font-size="11" fill="#A8A29E">0s</text>
  <text x="310" y="140" font-family="Arial, sans-serif" font-size="11" fill="#A8A29E">10s</text>
  <text x="490" y="140" font-family="Arial, sans-serif" font-size="11" fill="#A8A29E">30s</text>
  <text x="555" y="285" font-family="Arial, sans-serif" font-size="11" fill="#A8A29E">60s</text>

  <!-- Needle pointing to ~12s mark -->
  <line x1="400" y1="260" x2="340" y2="170" stroke="#1C1917" stroke-width="3" stroke-linecap="round"/>
  <circle cx="400" cy="260" r="8" fill="#1C1917"/>
  <circle cx="400" cy="260" r="4" fill="white"/>

  <!-- Center label -->
  <text x="400" y="240" font-family="Arial, sans-serif" font-size="40" fill="#0D9488" font-weight="800" text-anchor="middle">&lt;15s</text>
  <text x="400" y="262" font-family="Arial, sans-serif" font-size="13" fill="#78716C" text-anchor="middle">average processing</text>

  <!-- Speed bars comparison (right side) -->
  <text x="630" y="120" font-family="Arial, sans-serif" font-size="12" fill="#78716C" font-weight="600" text-anchor="middle">vs Desktop</text>
  <!-- Our bar -->
  <rect x="590" y="135" width="80" height="24" rx="4" fill="#0D9488"/>
  <text x="595" y="152" font-family="Arial, sans-serif" font-size="11" fill="white" font-weight="600">~12s</text>
  <text x="590" y="172" font-family="Arial, sans-serif" font-size="10" fill="#0D9488">Ours</text>
  <!-- Desktop bar -->
  <rect x="590" y="190" width="160" height="24" rx="4" fill="#C8B8A8"/>
  <text x="595" y="207" font-family="Arial, sans-serif" font-size="11" fill="white" font-weight="600">~45s</text>
  <text x="590" y="227" font-family="Arial, sans-serif" font-size="10" fill="#C8B8A8">Desktop avg</text>
  <!-- Heavy app bar -->
  <rect x="590" y="245" width="240" height="24" rx="4" fill="#E7E0D8"/>
  <text x="595" y="262" font-family="Arial, sans-serif" font-size="11" fill="#78716C" font-weight="600">2–5 min</text>
  <text x="590" y="282" font-family="Arial, sans-serif" font-size="10" fill="#A8A29E">DAW import</text>

  <!-- Bottom note -->
  <text x="400" y="362" font-family="Arial, sans-serif" font-size="12" fill="#A8A29E" text-anchor="middle">Tested with a 4-minute stereo MP3 (320 kbps) on Chrome 120 — your mileage may vary</text>
</svg>