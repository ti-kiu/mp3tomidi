<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDF8F3" rx="16"/>
  <rect x="40" y="30" width="720" height="340" rx="12" fill="white" stroke="#F5E6D3" stroke-width="1.5"/>
  <text x="400" y="68" font-family="Arial, sans-serif" font-size="22" fill="#1C1917" font-weight="700" text-anchor="middle">Your Data Never Leaves Your Browser</text>

  <!-- Browser window (center) -->
  <rect x="280" y="100" width="240" height="180" rx="10" fill="#FFF7ED" stroke="#C8B8A8" stroke-width="2"/>
  <!-- Browser bar -->
  <rect x="280" y="100" width="240" height="28" rx="10" fill="#F5E6D3"/>
  <rect x="280" y="118" width="240" height="10" fill="#F5E6D3"/>
  <circle cx="300" cy="114" r="4" fill="#EF4444"/>
  <circle cx="313" cy="114" r="4" fill="#F59E0B"/>
  <circle cx="326" cy="114" r="4" fill="#22C55E"/>
  <!-- Audio waveform inside browser -->
  <g transform="translate(310, 175)">
    <rect x="0" y="-15" width="6" height="30" rx="3" fill="#EA580C" opacity="0.6"/>
    <rect x="12" y="-25" width="6" height="50" rx="3" fill="#EA580C" opacity="0.7"/>
    <rect x="24" y="-18" width="6" height="36" rx="3" fill="#EA580C" opacity="0.6"/>
    <rect x="36" y="-30" width="6" height="60" rx="3" fill="#EA580C" opacity="0.8"/>
    <rect x="48" y="-12" width="6" height="24" rx="3" fill="#EA580C" opacity="0.6"/>
    <rect x="60" y="-22" width="6" height="44" rx="3" fill="#EA580C" opacity="0.7"/>
    <rect x="72" y="-10" width="6" height="20" rx="3" fill="#EA580C" opacity="0.5"/>
    <rect x="84" y="-28" width="6" height="56" rx="3" fill="#EA580C" opacity="0.8"/>
    <rect x="96" y="-16" width="6" height="32" rx="3" fill="#EA580C" opacity="0.6"/>
    <rect x="108" y="-20" width="6" height="40" rx="3" fill="#EA580C" opacity="0.7"/>
    <rect x="120" y="-8" width="6" height="16" rx="3" fill="#EA580C" opacity="0.5"/>
    <rect x="132" y="-14" width="6" height="28" rx="3" fill="#EA580C" opacity="0.6"/>
    <rect x="144" y="-22" width="6" height="44" rx="3" fill="#EA580C" opacity="0.7"/>
    <rect x="156" y="-10" width="6" height="20" rx="3" fill="#EA580C" opacity="0.5"/>
    <rect x="168" y="-18" width="6" height="36" rx="3" fill="#EA580C" opacity="0.6"/>
  </g>
  <!-- CPU chip label inside browser -->
  <text x="400" y="255" font-family="Arial, sans-serif" font-size="10" fill="#78716C" text-anchor="middle">WebAudio API</text>

  <!-- Lock icon (right side) -->
  <g transform="translate(620, 150)">
    <!-- Lock body -->
    <rect x="0" y="25" width="50" height="40" rx="6" fill="#0D9488"/>
    <!-- Lock shackle -->
    <path d="M 10 25 L 10 15 A 15 15 0 0 1 40 15 L 40 25" fill="none" stroke="#0D9488" stroke-width="5" stroke-linecap="round"/>
    <!-- Keyhole -->
    <circle cx="25" cy="40" r="5" fill="white"/>
    <rect x="23" y="44" width="4" height="10" rx="2" fill="white"/>
  </g>
  <text x="645" y="235" font-family="Arial, sans-serif" font-size="13" fill="#0D9488" font-weight="700" text-anchor="middle">Encrypted</text>

  <!-- "No Upload" badge (left side) -->
  <g transform="translate(100, 140)">
    <circle cx="35" cy="35" r="35" fill="#FEE2E2"/>
    <circle cx="35" cy="35" r="28" fill="none" stroke="#DC2626" stroke-width="3"/>
    <!-- Cloud with up arrow (crossed out) -->
    <text x="35" y="42" font-family="Arial, sans-serif" font-size="28" fill="#DC2626" text-anchor="middle">☁</text>
    <!-- X over cloud -->
    <line x1="15" y1="18" x2="55" y2="52" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
    <line x1="55" y1="18" x2="15" y2="52" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="135" y="235" font-family="Arial, sans-serif" font-size="13" fill="#DC2626" font-weight="700" text-anchor="middle">No Upload</text>

  <!-- "100% Client-Side" badge (bottom center) -->
  <rect x="300" y="300" width="200" height="40" rx="20" fill="#0D9488"/>
  <text x="400" y="325" font-family="Arial, sans-serif" font-size="15" fill="white" font-weight="700" text-anchor="middle">100% Client-Side</text>

  <!-- Connecting dashed lines -->
  <line x1="170" y1="175" x2="280" y2="175" stroke="#C8B8A8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="520" y1="175" x2="610" y2="175" stroke="#C8B8A8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="400" y1="280" x2="400" y2="300" stroke="#C8B8A8" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Bottom text -->
  <text x="400" y="362" font-family="Arial, sans-serif" font-size="12" fill="#A8A29E" text-anchor="middle">All processing happens in your browser — nothing is uploaded to any server</text>
</svg>