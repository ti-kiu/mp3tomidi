<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDF8F3"/>
  <rect x="20" y="20" width="760" height="360" rx="16" fill="white" stroke="#C8B8A8" stroke-width="1.5"/>
  <text x="400" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#2D2319">MIDI Piano Roll vs Audio Waveform</text>
  <!-- MIDI Piano Roll -->
  <text x="210" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#EA580C">MIDI Piano Roll</text>
  <g transform="translate(30, 95)">
    <rect x="0" y="0" width="360" height="230" rx="8" fill="#FEF3E2" stroke="#EA580C" stroke-width="1.5"/>
    <!-- Grid -->
    <line x1="0" y1="46" x2="360" y2="46" stroke="#C8B8A8" stroke-width="0.3"/>
    <line x1="0" y1="92" x2="360" y2="92" stroke="#C8B8A8" stroke-width="0.3"/>
    <line x1="0" y1="138" x2="360" y2="138" stroke="#C8B8A8" stroke-width="0.3"/>
    <line x1="0" y1="184" x2="360" y2="184" stroke="#C8B8A8" stroke-width="0.3"/>
    <line x1="72" y1="0" x2="72" y2="230" stroke="#C8B8A8" stroke-width="0.3"/>
    <line x1="144" y1="0" x2="144" y2="230" stroke="#C8B8A8" stroke-width="0.3"/>
    <line x1="216" y1="0" x2="216" y2="230" stroke="#C8B8A8" stroke-width="0.3"/>
    <line x1="288" y1="0" x2="288" y2="230" stroke="#C8B8A8" stroke-width="0.3"/>
    <!-- Note rectangles -->
    <rect x="10" y="20" width="55" height="18" rx="3" fill="#EA580C"/>
    <rect x="75" y="35" width="40" height="18" rx="3" fill="#EA580C" opacity="0.85"/>
    <rect x="125" y="15" width="65" height="18" rx="3" fill="#EA580C"/>
    <rect x="200" y="50" width="35" height="18" rx="3" fill="#EA580C" opacity="0.9"/>
    <rect x="245" y="30" width="50" height="18" rx="3" fill="#EA580C"/>
    <rect x="305" y="45" width="40" height="18" rx="3" fill="#EA580C" opacity="0.85"/>
    <rect x="10" y="70" width="30" height="18" rx="3" fill="#EA580C" opacity="0.8"/>
    <rect x="50" y="85" width="70" height="18" rx="3" fill="#EA580C"/>
    <rect x="130" y="65" width="45" height="18" rx="3" fill="#EA580C" opacity="0.9"/>
    <rect x="185" y="80" width="55" height="18" rx="3" fill="#EA580C"/>
    <rect x="250" y="100" width="40" height="18" rx="3" fill="#EA580C" opacity="0.85"/>
    <rect x="10" y="130" width="80" height="18" rx="3" fill="#EA580C"/>
    <rect x="100" y="115" width="35" height="18" rx="3" fill="#EA580C" opacity="0.85"/>
    <rect x="145" y="140" width="60" height="18" rx="3" fill="#EA580C"/>
    <rect x="215" y="120" width="45" height="18" rx="3" fill="#EA580C" opacity="0.9"/>
    <rect x="270" y="150" width="50" height="18" rx="3" fill="#EA580C"/>
    <rect x="10" y="180" width="55" height="18" rx="3" fill="#EA580C" opacity="0.8"/>
    <rect x="75" y="170" width="40" height="18" rx="3" fill="#EA580C"/>
    <rect x="125" y="190" width="70" height="18" rx="3" fill="#EA580C" opacity="0.9"/>
    <rect x="205" y="175" width="50" height="18" rx="3" fill="#EA580C"/>
    <rect x="265" y="185" width="40" height="18" rx="3" fill="#EA580C" opacity="0.85"/>
    <!-- Piano keys on left -->
    <rect x="-20" y="15" width="18" height="25" rx="2" fill="white" stroke="#C8B8A8" stroke-width="0.5"/>
    <rect x="-20" y="60" width="18" height="25" rx="2" fill="white" stroke="#C8B8A8" stroke-width="0.5"/>
    <rect x="-20" y="110" width="18" height="25" rx="2" fill="white" stroke="#C8B8A8" stroke-width="0.5"/>
    <rect x="-20" y="160" width="18" height="25" rx="2" fill="white" stroke="#C8B8A8" stroke-width="0.5"/>
  </g>
  <!-- VS -->
  <text x="420" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#C8B8A8">vs</text>
  <!-- Audio Waveform -->
  <text x="620" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1A7A3A">Audio Waveform</text>
  <g transform="translate(440, 95)">
    <rect x="0" y="0" width="330" height="230" rx="8" fill="#F0F7F3" stroke="#1A7A3A" stroke-width="1.5"/>
    <!-- Waveform centered around middle -->
    <path d="M10,115 L20,90 L25,135 L30,80 L35,145 L40,70 L45,150 L50,85 L55,138 L60,75 L65,148 L70,90 L75,130 L80,80 L85,145 L90,70 L95,152 L100,82 L105,140 L110,75 L115,148 L120,92 L125,128 L130,82 L135,142 L140,72 L145,150 L150,88 L155,135 L160,78 L165,145 L170,85 L175,132 L180,80 L185,140 L190,72 L195,148 L200,85 L205,138 L210,78 L215,145 L220,90 L225,128 L230,82 L235,142 L240,72 L245,150 L250,88 L255,135 L260,78 L265,145 L270,85 L275,132 L280,80 L285,140 L290,72 L295,148 L300,90 L305,130 L310,82 L315,142 L320,100" fill="none" stroke="#1A7A3A" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="115" x2="320" y2="115" stroke="#C8B8A8" stroke-width="0.5" stroke-dasharray="4,4"/>
  </g>
  <!-- Bottom -->
  <text x="210" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#7A6B5D">Individual notes, editable</text>
  <text x="620" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#7A6B5D">Mixed sound, not editable</text>
</svg>