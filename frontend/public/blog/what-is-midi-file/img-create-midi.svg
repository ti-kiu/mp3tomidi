<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDF8F3"/>
  <rect x="20" y="20" width="760" height="360" rx="16" fill="white" stroke="#C8B8A8" stroke-width="1.5"/>
  <text x="400" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#2D2319">Three Ways to Create MIDI</text>
  <!-- Method 1: Record -->
  <g transform="translate(50, 85)">
    <rect x="0" y="0" width="210" height="260" rx="12" fill="white" stroke="#C8B8A8" stroke-width="1.5"/>
    <circle cx="105" cy="45" r="28" fill="#EA580C"/>
    <text x="105" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="white">🎹</text>
    <text x="105" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">REC</text>
    <text x="105" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#2D2319">1. Record</text>
    <text x="105" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#7A6B5D">Play a MIDI keyboard</text>
    <text x="105" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#7A6B5D">or controller live.</text>
    <text x="105" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#7A6B5D">DAW captures every</text>
    <text x="105" y="176" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#7A6B5D">note as you play.</text>
    <rect x="15" y="200" width="180" height="35" rx="8" fill="#FEF3E2" stroke="#EA580C" stroke-width="1"/>
    <text x="105" y="223" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#EA580C">Best for performance</text>
  </g>
  <!-- Method 2: Draw -->
  <g transform="translate(295, 85)">
    <rect x="0" y="0" width="210" height="260" rx="12" fill="white" stroke="#C8B8A8" stroke-width="1.5"/>
    <circle cx="105" cy="45" r="28" fill="#3B82F6"/>
    <text x="105" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="white">✏️</text>
    <text x="105" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#2D2319">2. Draw</text>
    <text x="105" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#7A6B5D">Click notes into a</text>
    <text x="105" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#7A6B5D">piano roll editor</text>
    <text x="105" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#7A6B5D">in your DAW. Note</text>
    <text x="105" y="176" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#7A6B5D">by note.</text>
    <rect x="15" y="200" width="180" height="35" rx="8" fill="#F0F0FF" stroke="#3B82F6" stroke-width="1"/>
    <text x="105" y="223" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#3B82F6">Best for precision</text>
  </g>
  <!-- Method 3: Convert -->
  <g transform="translate(540, 85)">
    <rect x="0" y="0" width="210" height="260" rx="12" fill="white" stroke="#1A7A3A" stroke-width="1.5"/>
    <circle cx="105" cy="45" r="28" fill="#1A7A3A"/>
    <text x="105" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="white">🔄</text>
    <text x="105" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#2D2319">3. Convert</text>
    <text x="105" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#7A6B5D">Drop an audio file</text>
    <text x="105" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#7A6B5D">into an AI converter.</text>
    <text x="105" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#7A6B5D">AI detects notes and</text>
    <text x="105" y="176" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#7A6B5D">outputs .mid file.</text>
    <rect x="15" y="200" width="180" height="35" rx="8" fill="#F0F7F3" stroke="#1A7A3A" stroke-width="1"/>
    <text x="105" y="223" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1A7A3A">Best for existing audio</text>
  </g>
  <text x="400" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#C8B8A8">mp3tomidi.vip</text>
</svg>