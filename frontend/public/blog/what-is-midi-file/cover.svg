<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#FDF8F3"/>
  <rect x="40" y="40" width="1120" height="550" rx="20" fill="white" stroke="#C8B8A8" stroke-width="2"/>
  <!-- MIDI logo area -->
  <rect x="420" y="80" width="360" height="100" rx="16" fill="#EA580C"/>
  <text x="600" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="rgba(255,255,255,0.8)">What is a</text>
  <text x="600" y="162" text-anchor="middle" font-family="system-ui, sans-serif" font-size="42" font-weight="800" fill="white">MIDI FILE?</text>
  <!-- Piano keys illustration -->
  <g transform="translate(200, 220)">
    <!-- White keys -->
    <rect x="0" y="0" width="40" height="180" rx="4" fill="white" stroke="#C8B8A8" stroke-width="1.5"/>
    <rect x="44" y="0" width="40" height="180" rx="4" fill="white" stroke="#C8B8A8" stroke-width="1.5"/>
    <rect x="88" y="0" width="40" height="180" rx="4" fill="white" stroke="#C8B8A8" stroke-width="1.5"/>
    <rect x="132" y="0" width="40" height="180" rx="4" fill="white" stroke="#C8B8A8" stroke-width="1.5"/>
    <rect x="176" y="0" width="40" height="180" rx="4" fill="white" stroke="#C8B8A8" stroke-width="1.5"/>
    <rect x="220" y="0" width="40" height="180" rx="4" fill="white" stroke="#C8B8A8" stroke-width="1.5"/>
    <rect x="264" y="0" width="40" height="180" rx="4" fill="white" stroke="#C8B8A8" stroke-width="1.5"/>
    <!-- Black keys -->
    <rect x="30" y="0" width="26" height="110" rx="3" fill="#2D2319"/>
    <rect x="74" y="0" width="26" height="110" rx="3" fill="#2D2319"/>
    <rect x="162" y="0" width="26" height="110" rx="3" fill="#2D2319"/>
    <rect x="206" y="0" width="26" height="110" rx="3" fill="#2D2319"/>
    <rect x="250" y="0" width="26" height="110" rx="3" fill="#2D2319"/>
  </g>
  <!-- Arrow from piano to file -->
  <path d="M540,310 L620,310" stroke="#EA580C" stroke-width="3" marker-end="url(#arr2)"/>
  <defs><marker id="arr2" markerWidth="10" markerHeight="7" refX="5" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#EA580C"/></marker></defs>
  <!-- MIDI file icon -->
  <g transform="translate(640, 220)">
    <rect x="0" y="0" width="160" height="180" rx="12" fill="#FEF3E2" stroke="#EA580C" stroke-width="2"/>
    <rect x="120" y="0" width="40" height="40" rx="0" fill="#FDF8F3"/>
    <polygon points="120,0 160,40 120,40" fill="#FEF3E2" stroke="#C8B8A8" stroke-width="1"/>
    <text x="80" y="70" text-anchor="middle" font-family="system-ui, monospace" font-size="16" font-weight="700" fill="#EA580C">.mid</text>
    <!-- Musical notation lines -->
    <line x1="20" y1="100" x2="140" y2="100" stroke="#C8B8A8" stroke-width="1"/>
    <line x1="20" y1="115" x2="140" y2="115" stroke="#C8B8A8" stroke-width="1"/>
    <line x1="20" y1="130" x2="140" y2="130" stroke="#C8B8A8" stroke-width="1"/>
    <line x1="20" y1="145" x2="140" y2="145" stroke="#C8B8A8" stroke-width="1"/>
    <line x1="20" y1="160" x2="140" y2="160" stroke="#C8B8A8" stroke-width="1"/>
    <!-- Note dots -->
    <circle cx="45" cy="115" r="6" fill="#EA580C"/>
    <circle cx="70" cy="130" r="6" fill="#EA580C"/>
    <circle cx="95" cy="100" r="6" fill="#EA580C"/>
    <circle cx="120" cy="145" r="6" fill="#EA580C"/>
  </g>
  <!-- Bottom tagline -->
  <text x="600" y="470" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="600" fill="#2D2319">The complete guide to MIDI files</text>
  <text x="600" y="510" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#7A6B5D">What they are, how they work, and how to create them</text>
  <text x="600" y="550" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#C8B8A8">mp3tomidi.vip</text>
</svg>