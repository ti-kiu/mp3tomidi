<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDF8F3"/>
  <rect x="20" y="20" width="760" height="360" rx="16" fill="white" stroke="#C8B8A8" stroke-width="1.5"/>
  <text x="400" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#2D2319">How MIDI Data Flows</text>
  <!-- Keyboard -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="140" height="80" rx="10" fill="#2D2319"/>
    <text x="70" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="white">Keyboard</text>
    <text x="70" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)">or any MIDI</text>
    <text x="70" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)">controller</text>
  </g>
  <!-- Arrow 1 -->
  <path d="M200,150 L260,150" stroke="#EA580C" stroke-width="3" marker-end="url(#a1)"/>
  <defs><marker id="a1" markerWidth="10" markerHeight="7" refX="5" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#EA580C"/></marker></defs>
  <text x="230" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#7A6B5D">MIDI signal</text>
  <!-- Computer -->
  <g transform="translate(270, 100)">
    <rect x="0" y="0" width="180" height="100" rx="10" fill="white" stroke="#EA580C" stroke-width="2"/>
    <rect x="10" y="10" width="160" height="60" rx="6" fill="#FEF3E2"/>
    <text x="90" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2D2319">DAW / Software</text>
    <text x="90" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#7A6B5D">Records note, velocity,</text>
    <text x="90" y="67" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#7A6B5D">timing as data</text>
    <text x="90" y="88" text-anchor="middle" font-family="system-ui, monospace" font-size="11" fill="#EA580C">saves → .mid file</text>
  </g>
  <!-- Arrow 2 -->
  <path d="M450,150 L510,150" stroke="#EA580C" stroke-width="3" marker-end="url(#a1)"/>
  <text x="480" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#7A6B5D">MIDI file</text>
  <!-- Sound module / synth -->
  <g transform="translate(520, 100)">
    <rect x="0" y="0" width="180" height="100" rx="10" fill="#F0F7F3" stroke="#1A7A3A" stroke-width="2"/>
    <text x="90" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1A7A3A">Synthesizer</text>
    <text x="90" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#7A6B5D">Reads MIDI data</text>
    <text x="90" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#7A6B5D">Generates sound</text>
    <text x="90" y="88" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1A7A3A">any instrument</text>
  </g>
  <!-- Arrow 3 -->
  <path d="M610,200 L610,250" stroke="#EA580C" stroke-width="3" marker-end="url(#a1)"/>
  <!-- Speaker -->
  <g transform="translate(540, 260)">
    <rect x="0" y="0" width="140" height="70" rx="10" fill="#2D2319"/>
    <text x="70" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="white">🔊 Speaker</text>
    <text x="70" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)">Sound output</text>
  </g>
  <!-- Key insight -->
  <rect x="60" y="260" width="380" height="90" rx="10" fill="#EA580C" opacity="0.1" stroke="#EA580C" stroke-width="1"/>
  <text x="250" y="288" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#2D2319">Key Insight:</text>
  <text x="250" y="310" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#7A6B5D">MIDI contains no sound — just instructions.</text>
  <text x="250" y="330" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#7A6B5D">The instrument decides how it sounds.</text>
</svg>