<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDF8F3"/>
  <rect x="20" y="20" width="760" height="360" rx="16" fill="white" stroke="#C8B8A8" stroke-width="1.5"/>
  <text x="400" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#2D2319">Step 1: Download the Audio</text>
  <!-- Browser mockup -->
  <rect x="80" y="85" width="640" height="260" rx="12" fill="#F8F8F8" stroke="#C8B8A8" stroke-width="1.5"/>
  <!-- URL bar -->
  <rect x="80" y="85" width="640" height="36" rx="12" fill="white" stroke="#C8B8A8" stroke-width="1"/>
  <rect x="95" y="94" width="400" height="18" rx="9" fill="#F0F0F0"/>
  <text x="110" y="107" font-family="system-ui, sans-serif" font-size="11" fill="#7A6B5D">y2mate.example.com</text>
  <!-- Input field -->
  <rect x="110" y="140" width="500" height="36" rx="8" fill="white" stroke="#EA580C" stroke-width="2"/>
  <text x="125" y="163" font-family="system-ui, sans-serif" font-size="13" fill="#7A6B5D">https://youtube.com/watch?v=...</text>
  <!-- Paste button -->
  <rect x="620" y="140" width="70" height="36" rx="8" fill="#EA580C"/>
  <text x="655" y="163" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="white">Paste</text>
  <!-- Format options -->
  <rect x="110" y="195" width="200" height="30" rx="6" fill="white" stroke="#C8B8A8" stroke-width="1"/>
  <text x="125" y="214" font-family="system-ui, sans-serif" font-size="12" fill="#2D2319">Format: MP3 ▾</text>
  <rect x="330" y="195" width="200" height="30" rx="6" fill="white" stroke="#C8B8A8" stroke-width="1"/>
  <text x="345" y="214" font-family="system-ui, sans-serif" font-size="12" fill="#2D2319">Quality: 320kbps ▾</text>
  <!-- Download button -->
  <rect x="110" y="250" width="580" height="48" rx="10" fill="#EA580C"/>
  <text x="400" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="white">↓ Download MP3</text>
  <!-- Tips -->
  <rect x="80" y="310" width="640" height="35" rx="8" fill="#FEF3E2" stroke="#C8B8A8" stroke-width="1"/>
  <text x="400" y="332" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#2D2319">💡 Tip: Choose 256kbps or higher for best MIDI conversion results</text>
  <text x="400" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#C8B8A8">mp3tomidi.vip</text>
</svg>