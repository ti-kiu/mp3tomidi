<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#FDF8F3"/>
  <rect x="20" y="20" width="760" height="360" rx="16" fill="white" stroke="#C8B8A8" stroke-width="1.5"/>
  <text x="400" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#2D2319">YouTube to MIDI: Two-Step Pipeline</text>
  <!-- Step 1 -->
  <rect x="60" y="100" width="200" height="140" rx="14" fill="#FEF3E2" stroke="#EA580C" stroke-width="1.5"/>
  <circle cx="160" cy="140" r="25" fill="#EA580C"/>
  <text x="160" y="147" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="white">1</text>
  <text x="160" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#2D2319">Extract Audio</text>
  <text x="160" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#7A6B5D">yt-dlp or online</text>
  <text x="160" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#7A6B5D">tool → MP3/WAV</text>
  <!-- Arrow 1 -->
  <path d="M270,170 L330,170" stroke="#EA580C" stroke-width="3" marker-end="url(#parr)"/>
  <defs><marker id="parr" markerWidth="10" markerHeight="7" refX="5" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#EA580C"/></marker></defs>
  <!-- Audio file -->
  <rect x="340" y="130" width="120" height="80" rx="10" fill="white" stroke="#C8B8A8" stroke-width="1.5"/>
  <text x="400" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#EA580C">♪</text>
  <text x="400" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2D2319">.mp3 / .wav</text>
  <!-- Arrow 2 -->
  <path d="M470,170 L530,170" stroke="#EA580C" stroke-width="3" marker-end="url(#parr)"/>
  <!-- Step 2 -->
  <rect x="540" y="100" width="200" height="140" rx="14" fill="#FEF3E2" stroke="#EA580C" stroke-width="1.5"/>
  <circle cx="640" cy="140" r="25" fill="#EA580C"/>
  <text x="640" y="147" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="white">2</text>
  <text x="640" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#2D2319">Convert to MIDI</text>
  <text x="640" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#7A6B5D">AI detects notes</text>
  <text x="640" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#7A6B5D">→ .mid file</text>
  <!-- Result -->
  <rect x="280" y="280" width="240" height="60" rx="10" fill="#F0F7F3" stroke="#1A7A3A" stroke-width="1.5"/>
  <text x="400" y="308" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1A7A3A">✓ MIDI file ready</text>
  <text x="400" y="328" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#7A6B5D">Total time: ~2 minutes</text>
  <!-- Arrow down from step 2 -->
  <path d="M640,240 L640,270 Q640,310 540,310 L520,310" stroke="#1A7A3A" stroke-width="2" marker-end="url(#garr)" fill="none"/>
  <defs><marker id="garr" markerWidth="10" markerHeight="7" refX="5" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#1A7A3A"/></marker></defs>
</svg>