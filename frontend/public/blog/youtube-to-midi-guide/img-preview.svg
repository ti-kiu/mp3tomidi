  <text x="400" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#2D2319">Piano Roll Preview</text>
  <!-- Piano roll -->
  <g transform="translate(60, 75)">
    <!-- Piano keys on left -->
    <rect x="0" y="0" width="40" height="270" rx="6" fill="#F0F0F0" stroke="#C8B8A8" stroke-width="1"/>
    <text x="20" y="25" text-anchor="middle" font-family="system-ui, monospace" font-size="10" fill="#7A6B5D">B5</text>
