<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" rx="12" fill="#FDF8F3"/>
  <text x="400" y="50" font-family="Space Grotesk, Arial" font-size="24" font-weight="700" fill="#1C1917" text-anchor="middle">MIDI Piano Roll Preview</text>
  <rect x="40" y="80" width="720" height="280" rx="12" fill="#fff" stroke="#E7E5E4" stroke-width="1"/>
  <!-- Grid -->
  <line x1="40" y1="160" x2="760" y2="160" stroke="#F5F5F4" stroke-width="1"/>
  <line x1="40" y1="240" x2="760" y2="240" stroke="#F5F5F4" stroke-width="1"/>
  <!-- Notes -->
  <rect x="70" y="110" width="80" height="16" rx="4" fill="#EA580C"/>
  <rect x="170" y="140" width="60" height="16" rx="4" fill="#FB923C"/>
  <rect x="250" y="100" width="100" height="16" rx="4" fill="#EA580C" opacity="0.8"/>
  <rect x="370" y="170" width="70" height="16" rx="4" fill="#C8B8A8"/>
  <rect x="460" y="130" width="90" height="16" rx="4" fill="#EA580C"/>
  <rect x="570" y="190" width="60" height="16" rx="4" fill="#FB923C" opacity="0.7"/>
  <rect x="650" y="150" width="80" height="16" rx="4" fill="#C8B8A8" opacity="0.8"/>
  <rect x="70" y="210" width="110" height="16" rx="4" fill="#EA580C" opacity="0.6"/>
  <rect x="200" y="250" width="80" height="16" rx="4" fill="#C8B8A8" opacity="0.7"/>
  <rect x="350" y="220" width="120" height="16" rx="4" fill="#EA580C" opacity="0.5"/>
  <rect x="500" y="270" width="90" height="16" rx="4" fill="#FB923C" opacity="0.6"/>
  <text x="400" y="390" font-family="DM Sans, Arial" font-size="13" fill="#78716C" text-anchor="middle">Detected notes from audio transcription</text>
</svg>
