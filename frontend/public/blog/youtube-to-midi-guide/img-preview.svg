    <line x1="45" y1="140" x2="705" y2="140" stroke="#C8B8A8" stroke-width="0.3"/>
    <line x1="45" y1="175" x2="705" y2="175" stroke="#C8B8A8" stroke-width="0.3"/>
    <line x1="45" y1="210" x2="705" y2="210" stroke="#C8B8A8" stroke-width="0.3"/>
    <line x1="45" y1="245" x2="705" y2="245" stroke="#C8B8A8" stroke-width="0.3"/>
    <!-- Time markers -->
