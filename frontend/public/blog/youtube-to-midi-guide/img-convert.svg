<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" rx="12" fill="#FDF8F3"/>
  <text x="400" y="50" font-family="Space Grotesk, Arial" font-size="24" font-weight="700" fill="#1C1917" text-anchor="middle">Convert to MIDI</text>
  <!-- Converter interface -->
  <rect x="40" y="80" width="720" height="280" rx="12" fill="#fff" stroke="#E7E5E4" stroke-width="1"/>
  <!-- File info -->
  <rect x="60" y="100" width="400" height="50" rx="8" fill="#FDF8F3"/>
  <text x="80" y="120" font-family="DM Sans, Arial" font-size="14" font-weight="600" fill="#1C1917">piano-cover.mp3</text>
  <text x="80" y="140" font-family="DM Sans, Arial" font-size="12" fill="#78716C">3.2 MB · 4:32</text>
  <!-- Quality selector -->
  <rect x="480" y="100" width="260" height="50" rx="8" fill="#F5F5F4"/>
  <text x="500" y="120" font-family="DM Sans, Arial" font-size="12" fill="#78716C">Quality</text>
  <rect x="500" y="128" width="70" height="18" rx="9" fill="#F5F5F4"/>
  <text x="535" y="141" font-family="DM Sans, Arial" font-size="11" fill="#78716C" text-anchor="middle">Fast</text>
  <rect x="580" y="128" width="70" height="18" rx="9" fill="#EA580C"/>
  <text x="615" y="141" font-family="DM Sans, Arial" font-size="11" fill="#fff" text-anchor="middle">Balanced</text>
  <rect x="660" y="128" width="70" height="18" rx="9" fill="#F5F5F4"/>
  <text x="695" y="141" font-family="DM Sans, Arial" font-size="11" fill="#78716C" text-anchor="middle">Detailed</text>
  <!-- Convert button -->
  <rect x="250" y="180" width="300" height="56" rx="16" fill="#EA580C"/>
  <text x="400" y="214" font-family="DM Sans, Arial" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Convert to MIDI</text>
  <text x="400" y="280" font-family="DM Sans, Arial" font-size="13" fill="#78716C" text-anchor="middle">Powered by Spotify Basic Pitch · Runs in your browser</text>
</svg>
