  <text x="500" y="243" font-family="system-ui, sans-serif" font-size="13" fill="#92400E">Yes (analytics)</text>
  <text x="660" y="243" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ea580c">Fair</text>
  <rect x="40" y="265" width="720" height="45" rx="4" fill="#FEF2F2"/>
  <text x="80" y="293" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#991B1B">Klangio</text>
  <text x="260" y="293" font-family="system-ui, sans-serif" font-size="13" fill="#991B1B">Unknown / Not stated</text>
  <text x="500" y="293" font-family="system-ui, sans-serif" font-size="13" fill="#991B1B">Yes (account required)</text>
