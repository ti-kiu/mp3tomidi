  <rect x="100" y="330" width="600" height="50" rx="10" fill="white" stroke="#C8B8A8" stroke-width="1.5"/>
  <text x="400" y="355" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563" text-anchor="middle">💡 For max privacy: use desktop tools (Audacity) — files never leave your computer</text>
  <text x="400" y="375" font-family="system-ui, sans-serif" font-size="13" fill="#C8B8A8" text-anchor="middle">For convenience: MP3toMIDI auto-deletes your files after conversion</text>
