  <text x="260" y="193" font-family="system-ui, sans-serif" font-size="13" fill="#166534">Browser-only (never uploaded)</text>
  <text x="500" y="193" font-family="system-ui, sans-serif" font-size="13" fill="#166534">No</text>
  <text x="660" y="193" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#16a34a">Excellent</text>
  <rect x="40" y="215" width="720" height="45" rx="4" fill="#FEF3C7"/>
  <text x="80" y="243" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#92400E">Convertio</text>
