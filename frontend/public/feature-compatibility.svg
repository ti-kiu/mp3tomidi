<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FEF3C7"/>
      <stop offset="100%" style="stop-color:#FEF9E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="24" fill="url(#bg)"/>
  <!-- DAW icons grid -->
  <rect x="60" y="80" width="120" height="60" rx="12" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="120" y="115" font-family="DM Sans, Arial" font-size="16" font-weight="600" fill="#B45309" text-anchor="middle">Ableton</text>
  <rect x="220" y="80" width="120" height="60" rx="12" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="280" y="115" font-family="DM Sans, Arial" font-size="16" font-weight="600" fill="#B45309" text-anchor="middle">FL Studio</text>
  <rect x="60" y="160" width="120" height="60" rx="12" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="120" y="195" font-family="DM Sans, Arial" font-size="16" font-weight="600" fill="#B45309" text-anchor="middle">Logic Pro</text>
  <rect x="220" y="160" width="120" height="60" rx="12" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="280" y="195" font-family="DM Sans, Arial" font-size="16" font-weight="600" fill="#B45309" text-anchor="middle">Cubase</text>
  <!-- MIDI file icon -->
  <rect x="160" y="240" width="80" height="40" rx="8" fill="#D97706"/>
  <text x="200" y="265" font-family="JetBrains Mono, Arial" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">.mid</text>
</svg>
